function cdate(c,k){ return c && c.dates ? (c.dates[k]||"") : ""; }

/* where an election stands, worked out from its dates */
function stageOf(c){
  if(!c) return {k:"none", label:"Not Set Up", i:0};
  if(c.closed) return {k:"closed", label:"Complete", i:6};
  const t=T(), d=k=>cdate(c,k);
  if(c.type==="board"){
    if(d("termStart") && t>=d("termStart")) return {k:"onboard", label:"New Terms Underway", i:5};
    if(d("bodApproval") && t>d("bodApproval")) return {k:"onboard", label:"Approved · Onboarding", i:4};
    if(d("nomCommittee") && t>=d("nomCommittee")) return {k:"review", label:"With the Board", i:3};
    if(d("slate") && t>=d("slate")) return {k:"slate", label:"Building the Slate", i:2};
    return {k:"recruit", label:"Recruiting", i:1};
  }
  if(c.final || (d("announce") && t>=d("announce"))) return (d("termStart") && t>=add(d("termStart"),45)) ? {k:"closed",label:"Complete",i:6} : {k:"onboard", label:"Results Out · Onboarding", i:5};
  if(d("ballotClose") && t>d("ballotClose")) return {k:"count", label:"Counting", i:4};
  if(d("ballotOpen") && t>=d("ballotOpen")) return {k:"vote", label:"Voting Open", i:3};
  if(d("nomClose") && t>d("nomClose")) return {k:"review", label:"Reviewing Nominees", i:2};
  if(d("nomOpen") && t>=d("nomOpen")) return {k:"nominate", label:"Nominations Open", i:1};
  return {k:"ready", label:"Getting Ready", i:0};
}
function stageBar(c){ const s=stageOf(c); let h='<div class="stg" aria-hidden="true">'; for(let i=0;i<6;i++) h+='<i class="'+(i<s.i?"on":i===s.i?"now":"")+'"></i>'; return h+'</div>'; }
function formOpen(c, kind){
  if(!c) return false;
  const o=(c.forms||{})[kind]||"auto";
  if(o==="open") return true; if(o==="closed") return false;
  const t=T();
  if(kind==="nominate") return !!(cdate(c,"nomOpen") && t>=cdate(c,"nomOpen") && t<=(cdate(c,"lastCall")||cdate(c,"nomClose")));
  return !!(cdate(c,"ballotOpen") && t>=cdate(c,"ballotOpen") && t<=cdate(c,"ballotClose"));
}
function mileLabel(t,k){ const m=(MILES[t]||[]).find(x=>x[0]===k); return m?m[1]:""; }
function nextMile(c){ if(!c||!c.dates) return null; const t=T(); const m=(MILES[c.type]||[]).find(([k])=>c.dates[k] && c.dates[k]>=t && !((c.done||{})[k])); return m? {k:m[0], label:m[1], date:c.dates[m[0]]} : null; }

/* ================= derived data ================= */
function seatsOf(c){ if(!c) return []; return vals("seats").filter(s=>s.cycle===c.id).sort((a,b)=>byName(a.group||"",b.group||"") || ((a.round||1)-(b.round||1)) || ((a.order||0)-(b.order||0)) || byName(a.position||"",b.position||"")); }
function nomsOf(seatId){ return vals("nominations").filter(n=>n.seat===seatId).sort((a,b)=>byName(fullName(a),fullName(b))); }
function liveNoms(seatId){ return nomsOf(seatId).filter(n=>n.status==="received"||n.status==="confirmed"); }
function onBallot(seatId){ return nomsOf(seatId).filter(n=>n.status==="confirmed"); }
function seatState(s){
  const live=liveNoms(s.id), conf=onBallot(s.id), need=+s.count||1;
  const cy=S.cycles[s.cycle]; const early=cy && stageOf(cy).i===0;
  if(!live.length) return early? {k:"gap", label:"Awaiting Nominations", cls:"wait"} : {k:"gap", label:"Gap", cls:"gap"};
  if(conf.length<live.length) return {k:"unconf", label:conf.length?"Confirming":"To Confirm", cls:"review"};
  if(conf.length<need) return {k:"short", label:"Short "+(need-conf.length), cls:"gap"};
  if(conf.length===need) return {k:"unopp", label:"Uncontested", cls:"ok"};
  return {k:"contest", label:"Contested", cls:"in"};
}
function shortBy(s){ return Math.max(0,(+s.count||1)-liveNoms(s.id).length); }
function nomsOpenYet(c){ return c && stageOf(c).i>=1; }
function groupsOf(type){ return vals("groups").filter(g=>g.type===type && g.active!==false).sort((a,b)=>byName(a.name,b.name)); }
function groupByName(n,t){ const L=vals("groups").filter(g=>g.name===n); if(!L.length) return null; if(t){ const x=L.find(g=>g.type===t); if(x) return x; } return L.find(g=>g.type!=="domain")||L[0]; }
function incumbents(group, position){ return vals("leaders").filter(l=>l.status!=="former" && l.group===group && posMatch(l.position, position)); }
function posMatch(a,b){ const f=x=>String(x||"").toLowerCase().replace(/^co-?/,"").replace(/\s*\(\d\)\s*/,"").replace(/[^a-z]/g,""); return f(a)===f(b); }
function seatLabel(s){ return (s.group && s.group!==TYPES[cycType(s)]?.name ? s.group+" · " : "")+(s.position||"Seat"); }
function cycType(s){ const c=S.cycles[s.cycle]; return c?c.type:""; }
function subsOf(c){ return vals("nomsubs").filter(x=>x.cycle===c.id); }
function pendingSubs(c){ return vals("nomsubs").filter(x=>(!c||x.cycle===c.id) && !S.nomreviews[x.id]); }

/* ballots: one company, one vote, in each CoP (or each election for the others) */
function votesOf(c){ return vals("votes").filter(v=>v.cycle===c.id).sort((a,b)=>(a.submittedAt||"")<(b.submittedAt||"")?-1:1); }
function voterRoll(c){ const list=c.voterList||(c.type==="goc"?"mvr":""); return list? vals("voters").filter(v=>v.list===list) : []; }
function voteStatus(c){
  const out={}; const vs=votesOf(c); const roll=voterRoll(c);
  const rollEmail=new Set(roll.map(v=>String(v.email||"").toLowerCase()).filter(Boolean));
  const rollCode={}; roll.forEach(v=>{ if(v.code) rollCode[v.code]=v; });
  const groups={};
  vs.forEach(v=>{
    const f=S.voteflags[v.id];
    const company = norm((v.voter||{}).company) || ("person:"+String((v.voter||{}).email||"").toLowerCase());
    const key=(v.group||"")+"|"+company;
    (groups[key]=groups[key]||[]).push(v.id);
    let st={k:"counted", why:""};
    if(v.hp) st={k:"excluded", why:"Caught by the spam check"};
    else if(roll.length && !(v.code && rollCode[v.code]) && !rollEmail.has(String((v.voter||{}).email||"").toLowerCase())) st={k:"hold", why:"Not on the voter list"};
    out[v.id]=Object.assign(st,{key, verified: !!(v.code && rollCode[v.code])});
    if(f && f.status) out[v.id]={k:f.status, why:f.reason||"", key, verified: out[v.id].verified, manual:true};
  });
  Object.values(groups).forEach(ids=>{
    const open=ids.filter(id=>!out[id].manual && out[id].k==="counted");
    const kept=ids.filter(id=>out[id].manual && out[id].k==="counted");
    if(ids.length>1){
      if(kept.length) open.forEach(id=>{ out[id]={k:"excluded", why:"Another ballot from this company counts", key:out[id].key}; });
      else if(open.length>1) open.forEach(id=>{ out[id]={k:"hold", why:"Company voted more than once", key:out[id].key, dup:true}; });
    }
  });
  return out;
}
function tally(c){
  const st=voteStatus(c); const res={};
  seatsOf(c).forEach(s=>{ res[s.id]={}; onBallot(s.id).forEach(n=>res[s.id][n.id]=0); });
  votesOf(c).forEach(v=>{ if((st[v.id]||{}).k!=="counted") return;
    Object.entries(v.choices||{}).forEach(([sid,picks])=>{ (Array.isArray(picks)?picks:[picks]).forEach(nid=>{ if(res[sid] && nid in res[sid]) res[sid][nid]++; }); });
  });
  return res;
}
function winnersOf(c, s, t){
  const saved=((c.results||{})[s.id]||{}).winners; if(saved && saved.length) return {ids:saved, tie:false, manual:true};
  const counts=t[s.id]||{}; const need=+s.count||1;
  const ranked=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  if(!ranked.length) return {ids:[], tie:false};
  if(ranked.length<=need) return {ids:ranked, tie:false, unopp:true};
  const cut=counts[ranked[need-1]]; const tie = counts[ranked[need]]===cut && cut>0;
  return {ids:ranked.slice(0,need), tie};
}

const CAL_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
const GRIP='<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5" cy="3" r="1.3"/><circle cx="11" cy="3" r="1.3"/><circle cx="5" cy="8" r="1.3"/><circle cx="11" cy="8" r="1.3"/><circle cx="5" cy="13" r="1.3"/><circle cx="11" cy="13" r="1.3"/></svg>';
function buildFields(fields, d){
  let h='', open=false;
  const close=()=>{ if(open){ h+='</div>'; open=false; } };
  (fields||[]).forEach(f=>{
    if(f.sec){ close(); h+='<div class="fsec">'+esc(f.sec)+'</div>'; return; }
    if(!open){ h+='<div class="fgrid">'; open=true; }
    const id="f-"+f.k, v = f.get? f.get(d) : d[f.k];
    const cls = 'field'+(f.wide||f.type==="textarea"||f.type==="checks"||f.type==="html"?" wide":"");
    h+='<div class="'+cls+'">';
    if(f.label && f.type!=="cb") h+='<label for="'+id+'">'+esc(f.label)+'</label>';
    if(f.type==="textarea") h+='<textarea id="'+id+'" rows="'+(f.rows||4)+'" placeholder="'+esc(f.ph||"")+'">'+esc(v||"")+'</textarea>';
    else if(f.type==="select") h+='<select id="'+id+'">'+(f.blank?'<option value="">'+esc(f.blank===true?"":f.blank)+'</option>':'')+f.opts.map(o=>{ const [ov,ol]=Array.isArray(o)?o:[o,o]; return '<option value="'+esc(ov)+'"'+(String(v==null?"":v)===String(ov)?" selected":"")+'>'+esc(ol)+'</option>'; }).join("")+'</select>';
    else if(f.type==="date") h+='<div class="datef"><input type="text" id="'+id+'" value="'+esc(fMD(v))+'" placeholder="e.g. 11/18/26" autocomplete="off"><button class="btn calb" type="button" data-cal="'+id+'" aria-label="Pick from a calendar" title="Pick from a calendar">'+CAL_SVG+'</button><input type="date" tabindex="-1" aria-hidden="true" data-for="'+id+'"></div>';
    else if(f.type==="checks") h+='<div class="cbs" id="'+id+'">'+f.opts.map(([ov,ol])=>'<label><input type="checkbox" value="'+esc(ov)+'"'+(v&&v[ov]?" checked":"")+'> '+esc(ol)+'</label>').join("")+'</div>';
    else if(f.type==="cb") h+='<div class="cbs"><label><input type="checkbox" id="'+id+'"'+(v?" checked":"")+'> '+esc(f.label)+'</label></div>';
    else if(f.type==="ro") h+='<div class="ro" id="'+id+'">'+esc(v||"—")+'</div>';
    else if(f.type==="html") h+='<div id="'+id+'">'+(f.html? f.html(d):"")+'</div>';
    else h+='<input type="'+(f.type==="number"?"number":f.type==="email"?"email":"text")+'" id="'+id+'" value="'+esc(v==null?"":v)+'" placeholder="'+esc(f.ph||"")+'" autocomplete="off"'+(f.list?' list="'+f.list+'"':'')+'>';
    if(f.hint) h+='<span class="hint">'+esc(f.hint)+'</span>';
    h+='</div>';
  });
  close(); return h;
}
function wireFields(root){
  $$("[data-cal]",root).forEach(b=>{
    const id=b.dataset.cal, txt=$("#"+id,root), di=root.querySelector('input[data-for="'+id+'"]');
    b.onclick=()=>{ const cur=parseDateIn(txt.value); if(cur) di.value=cur; try{ di.showPicker(); }catch(e){ di.style.pointerEvents="auto"; di.focus(); di.click(); } };
    di.onchange=()=>{ txt.value=fMD(di.value); if(PANE) PANE.dirty=true; };
    txt.onblur=()=>{ const p=parseDateIn(txt.value); if(p) txt.value=fMD(p); };
  });
}
function readFields(fields){
  const out={}; let bad=null;
  (fields||[]).forEach(f=>{
    if(!f.k || f.type==="ro" || f.type==="html" || f.sec) return;
    const el=$("#f-"+f.k); if(!el) return;
    if(f.type==="checks"){ const o={}; $$("input",el).forEach(i=>{ if(i.checked) o[i.value]=true; }); out[f.k]=o; }
    else if(f.type==="cb") out[f.k]=el.checked;
    else if(f.type==="date"){ const p=parseDateIn(el.value); if(p===null){ bad=bad||f.label; el.focus(); } else out[f.k]=p; }
    else if(f.type==="number") out[f.k]= el.value===""?"":Number(el.value);
    else out[f.k]=el.value.trim();
  });
  if(bad){ const m=$("#pf-msg"); if(m) m.textContent="\""+bad+"\" isn't a date I can read. Try 11/18/26."; return null; }
  return out;
}

function slateOf(c){
  /* what the public ballot shows: only nominees who've confirmed. Names, companies and statements only. */
  const ss=seatsOf(c).filter(s=>(s.round||1)===(c.round2?2:1));
  const groups={};
  ss.forEach(s=>{ const g=MULTI(c.type)?s.group:TYPES[c.type].name; (groups[g]=groups[g]||[]).push({id:s.id, position:s.position, count:+s.count||1,
    nominees:onBallot(s.id).map(n=>({id:n.id, name:fullName(n), company:n.company||"", title:n.title||"", statement:n.statement||""}))}); });
  return {cycle:c.id, type:c.type, year:c.year, name:c.year+" "+TYPES[c.type].name+(c.round2?" Leadership":""), announce:cdate(c,"announce"), opens:cdate(c,c.round2?"leadNom":"ballotOpen"), mode:(c.forms||{}).ballot||"auto", closes:cdate(c,c.round2?"leadVote":"ballotClose"),
    groups:Object.keys(groups).sort(byName).map(g=>({name:g, seats:groups[g].sort((a,b)=>POSITIONS.indexOf(a.position)-POSITIONS.indexOf(b.position))}))};
}

function openWinner(c,s){

  openPane({eye:"Results · "+seatLabel(s), title:"Set the Winner", data:{}, noFocus:true,
    fields:[{k:"w",label:"Winner"+((+s.count||1)>1?"s":""),type:"checks",opts:ns.map(n=>[n.id, fullName(n)+" ("+((t[s.id]||{})[n.id]||0)+" votes)"]),get:()=>Object.fromEntries(w.ids.map(i=>[i,true]))},
      {k:"why",label:"Why (for the record)",wide:true,hint:"For example: tie settled by the CoP, or a nominee withdrew after the vote"}],
    save:async v=>{ const res=Object.assign({},c.results||{}); res[s.id]={winners:Object.keys(v.w||{}), why:v.why}; await patch("cycles",c.id,{results:res}); }});
}
function downloadCount(c){
  const t=tally(c); const rows=[["Election","Group","Position","Nominee","Company","Votes","Elected"]];
  seatsOf(c).forEach(s=>{ const w=winnersOf(c,s,t); Object.keys(t[s.id]||{}).forEach(i=>{ const n=S.nominations[i]||{}; rows.push([c.year+" "+TYPES[c.type].name, s.group||"", s.position||"", fullName(n), n.company||"", t[s.id][i], w.ids.includes(i)?"Yes":""]); }); });
  rows.push([]); rows.push(["Ballot","Submitted","Voter","Email","Company","CoP","Status","Reason"]);
  const st=voteStatus(c); votesOf(c).forEach(v=>rows.push([v.id, v.submittedAt||"", fullName(v.voter||{}), (v.voter||{}).email||"", (v.voter||{}).company||"", v.group||"", (st[v.id]||{}).k||"", (st[v.id]||{}).why||""]));
  const csv=rows.map(r=>r.map(x=>{ x=String(x==null?"":x); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }).join(",")).join("\r\n");
  if(DL) DL.save({filename:c.id+"-count.csv", data:csv}).catch(()=>copyText(csv,"Count")); else copyText(csv,"Count");
}
async function applyResults(c){
  const res=c.results||{}; const term=+(c.year); let added=0;
  for(const s of seatsOf(c)){
    const winners=(res[s.id]||{}).winners||[];
    if(!winners.length) continue;
    const yrs=+s.termYears||1;
    const end=(term+yrs-1)+"-12-31", start=term+"-01-01";
    const gname = MULTI(c.type)? s.group : "Governance Committee";
    const gtype = MULTI(c.type)? c.type : "gov";
    const pos = c.type==="goc"&&(s.round||1)===1 ? "Member" : s.position;
    const keep=new Set();
    for(const nid of winners){
      const n=S.nominations[nid]; if(!n) continue;
      const nm=fullName(n);
      const ex=vals("leaders").find(l=>l.status!=="former" && l.group===gname && posMatch(l.position,pos) && norm(l.name)===norm(nm));
      const lid=ex?ex.id:uid("l"); keep.add(lid);
      await put("leaders",lid,Object.assign({},ex||{},{group:gname, gtype, position:pos, name:nm, company:n.company||"", email:n.email||"", termStart:ex?ex.termStart:start, termEnd:end, status:"active", fromCycle:c.id}));
      const oid=c.id+"__"+nid;
      if(!S.onboard[oid] && !ex) { await put("onboard",oid,{cycle:c.id, nomination:nid, leader:lid, name:nm, company:n.company||"", email:n.email||"", group:gname, position:pos, checks:{}}); added++; }
    }
    /* whoever held the seat and wasn't re-elected rolls off at the end of the year */
    for(const l of vals("leaders").filter(l=>l.status!=="former" && l.group===gname && posMatch(l.position,s.position) && !keep.has(l.id))){
      await put("leaders",l.id,Object.assign({},l,{status:"former", termEnd:(term-1)+"-12-31", leftCycle:c.id}));
    }
  }
  await patch("cycles",c.id,{applied:true, appliedAt:new Date().toISOString()});
  toast("Roster updated · "+plural(added,"new leader")+" to onboard", 4000);
}

async function applySlate(x,nid,v){
  const rec=Object.assign({},x,v,{applied:true}); await put("slate",nid,rec);
  const c=S.cycles[rec.cycle]; const y=c?+c.year:curYear();
  if(rec.kind==="join"){ const ex=boardMembers().find(l=>norm(l.name)===norm(rec.person)); const lid=ex?ex.id:uid("l");
    await put("leaders",lid,Object.assign({},ex||{},{gtype:"board", group:"Board of Directors", position:"Director", name:rec.person, company:rec.company||"", seat:rec.seat||"", termStart:rec.termStart||y+"-01-01", termEnd:rec.termEnd||"", status:"active"}));
    const oid=rec.cycle+"__"+nid; if(!S.onboard[oid]) await put("onboard",oid,{cycle:rec.cycle, leader:lid, name:rec.person, company:rec.company||"", group:"Board of Directors", position:"Director", checks:{}}); }
  else if(rec.kind==="extend" && rec.leader && S.leaders[rec.leader]) await patch("leaders",rec.leader,{termEnd:rec.termEnd||S.leaders[rec.leader].termEnd});
  else if(rec.kind==="exit" && rec.leader && S.leaders[rec.leader]) await patch("leaders",rec.leader,{status:"former", termEnd:rec.termEnd||S.leaders[rec.leader].termEnd||((y-1)+"-12-31")});
  else if((rec.kind==="committee"||rec.kind==="officer") && rec.leader && S.leaders[rec.leader]){ const l=S.leaders[rec.leader]; const roles=String(l.roles||"").split(/;\s*/).filter(Boolean); if(rec.detail && !roles.includes(rec.detail)) roles.push(rec.detail); await patch("leaders",rec.leader,{roles:roles.join("; ")}); }
}

/* ================= Nominations ================= */
function subFlags(x){
  const f=[]; const n=x.nominee||{};
  if(x.hp) f.push(["Caught by the Spam Check","changes"]);
  else if([n.first,n.last,n.company,n.title,x.statement,(x.nominator||{}).name].some(looksSpammy)) f.push(["Looks Like Spam","sp"]);
  if(x.seat && !S.seats[x.seat] && x.type!=="board") f.push(["Seat Not Found","changes"]);
  const dup=vals("nominations").find(m=>m.cycle===x.cycle && (m.seat===x.seat||x.type==="board") && norm(fullName(m))===norm(fullName(n)));
  if(dup) f.push(["Already Nominated","review"]);
  return {flags:f, dup};
}
async function acceptSub(x){
  if(!x) return; const n=x.nominee||{}; const c=S.cycles[x.cycle]; const nid=uid("n");
  if(c && c.type==="board"){
    await put("nominations",nid,{cycle:x.cycle, stage:"prospect", status:"received", source:"form", subId:x.id, first:n.first, last:n.last, email:n.email, company:n.company, title:n.title, seatCat:x.seatCat||"", notes:(x.statement||"")+(x.self?"":" (recommended by "+((x.nominator||{}).name||"")+")"), receivedAt:x.submittedAt});
  } else {
    await put("nominations",nid,{cycle:x.cycle, seat:x.seat, status:"received", source:"form", subId:x.id, first:n.first, last:n.last, email:n.email, company:n.company, title:n.title, aware:x.aware||"no", member:"check", statement:x.statement||"", self:!!x.self, nominator:x.nominator||null, receivedAt:x.submittedAt});
  }
  await put("nomreviews",x.id,{decision:"accepted", nomination:nid, at:new Date().toISOString()});
  toast("Accepted · "+fullName(n));
  if(c && c.type==="board") openProspect(nid,c); else openNomination(nid);
}

  const noms=vals("nominations").filter(x=>x.cycle===c.id && (x.status==="received"||x.status==="confirmed"));
  const toConfirm=noms.filter(x=>x.status==="received").length;

    band(st.label+(n?' · next: '+n.label+' '+fS(n.date):''),
      tile(people, "Seats Up", MULTI(type)? new Set(r1.map(s=>s.group)).size+(type==="aof"?" Areas of Focus":" Business Domains") : "on one ballot")+
      tile(noms.length,"Nominations","received and on the ballot")+
      (false? "" : tile(r1.reduce((a,s)=>a+shortBy(s),0),"Nominees Still Needed",st.i===0?"nominations not open yet":"to fill every seat",{hot:st.i>=1 && r1.some(s=>shortBy(s)>0)}))+
      tile(toConfirm,"To Confirm","nominee hasn't said yes yet",{hot:toConfirm>0 && st.i>=2})+
      tile(conf+" of "+r1.length,"Ready for the Ballot","every nominee confirmed")+
      tile(vs.length,"Ballots In",hold?hold+" on hold":(formOpen(c,"ballot")?"ballot open now":"ballot closed"),{hot:hold>0}))+
    milesHtml(c)+
    (inbox?'<div class="banner">'+plural(inbox,"form entry","form entries")+' for this election '+(inbox===1?"is":"are")+' waiting in the Nominations inbox. <button class="btn sm" type="button" data-go="noms">Review Now</button></div>':'')+
    subtabs(type,[["seats",type==="aof"?"Areas of Focus":type==="domain"?"Domains":"Seats"],["ballot","Ballot"],["results","Results"],["tasks","Tasks"]])+'<div id="el-body"></div>';
  const body=$("#el-body",el); const sub=SUB[type];

  else body.innerHTML='<div class="toolbar"><span class="note">Drag a task to Done. Open one to change its date or who\'s doing it.</span><span class="sp"></span><button class="btn sm" type="button" data-tnew="'+esc(c.id)+'">+ Task</button></div>'+tasksBoard("kb-"+type, vals("tasks").filter(x=>x.cycle===c.id));
  wireYear(el,type+"-y"); wireSub(el,type); wireGo(el);
  $("#el-dates",el).onclick=()=>openDates(c);
  $("#el-addseat",el).onclick=()=>openSeat(null,c);
  $("#el-addnom",el).onclick=()=>openNomination(null,{cycle:c.id});
  $$("[data-mile]",el).forEach(b=>b.onclick=()=>openDates(c,b.dataset.mile));
  $$("[data-tnew]",el).forEach(b=>b.onclick=()=>openTask(null,b.dataset.tnew));
  if(sub==="seats"){
    wireF(body,()=>renderElection(type));
    $$("[data-cop]",body).forEach(b=>b.onclick=()=>openCop(c,b.dataset.cop));
    $$("[data-seat]",body).forEach(r=>r.onclick=e=>{ e.stopPropagation(); openSeat(r.dataset.seat,c); });
    $$("[data-nom]",body).forEach(a=>a.onclick=e=>{ e.stopPropagation(); openNomination(a.dataset.nom); });

function calendarHtml(list, cs){
  const t=T(); if(!UI.calMonth){ const nx=list.filter(x=>!x.done && x.due && x.due>=t).sort((a,b)=>a.due<b.due?-1:1)[0]; UI.calMonth=(nx?nx.due:t).slice(0,7); }
  const [yy,mm]=UI.calMonth.split("-").map(Number);

  const ev={}; list.forEach(x=>{ if(x.due) (ev[x.due]=ev[x.due]||[]).push({task:x}); });
  cs.forEach(c=>(MILES[c.type]||[]).forEach(([k,l])=>{ const d=cdate(c,k); if(d) (ev[d]=ev[d]||[]).unshift({mile:true, c, l}); }));

  const col={aof:"var(--c1)",domain:"var(--c2)",goc:"var(--c3)",board:"var(--c5)"};

    d.setDate(d.getDate()+1); }
  return h+'</div></div><div class="legend" style="padding:10px 14px">'+Object.keys(col).map(k=>'<span><i class="dot" style="background:'+col[k]+'"></i>'+esc(TYPES[k].name)+' step</span>').join("")+'<span><i class="dot" style="background:var(--bad)"></i>Task past due</span><span><i class="dot" style="background:var(--good)"></i>Task done</span></div></div>';
}

/* ================= Board of Directors ================= */
function boardPicture(c){
  const y=+c.year, yStart=y+"-01-01";
  const mem=boardMembers().filter(l=>l.status!=="former");
  const slate=vals("slate").filter(x=>x.cycle===c.id);
  const exitIds=new Set(slate.filter(x=>x.kind==="exit").map(x=>x.leader).filter(Boolean));
  const extIds=new Set(slate.filter(x=>x.kind==="extend" && x.approval!=="declined").map(x=>x.leader).filter(Boolean));
  const leaving=mem.filter(l=>exitIds.has(l.id) || (l.termEnd && l.termEnd<yStart && !extIds.has(l.id)));
  const stay=mem.filter(l=>!leaving.includes(l));
  const joinNew=slate.filter(x=>x.kind==="join" && x.approval!=="declined" && !mem.some(l=>norm(l.name)===norm(x.person)));
  return {mem, slate, leaving, stay, joinNew, extIds, yStart};
}

    '<div class="toolbar">'+fbtns("nomType",[["","Every Election"],["domain","Business Domains"],["aof","Areas of Focus"],["goc","Governance Committee"]],f)+'<span class="sp"></span>'+findBox("nm-q",q,"Find a nominee or company")+'</div>'+

async function acceptSubQuiet(x,status){

  await put("nomreviews",x.id,{decision:"accepted", nomination:nid, at:new Date().toISOString()});
  toast("Accepted · "+fullName(n));
}

/* ============================================================================
   THE NEW STRUCTURE, MEETING TRACKERS, AND THE AUTOPILOT
   - Business Domains oversee Areas of Focus (elected Co-Chairs) and Task Forces.
   - Meeting Trackers is the source of truth for which groups are still meeting,
     and for how many meetings each leader attended.
   - The Outbox drafts every email on schedule; Jonna approves (or a rule sends on
     its own); nothing sends until Jonna presses Send. The "Elections Outbox" flow then sends it from elections@mismo.org and logs it.
   ========================================================================== */
const ELECTIONS_FROM = "elections@mismo.org";
/* Higher Logic only takes an emailed post from a member, so posts to MISMO Connect go from Jonna's
   own address (a member of every community); everything else goes from elections@mismo.org. */
const CONNECT_FROM = ()=>{ const a=(typeof S!=="undefined"&&S.settings&&S.settings.automation)||{}; return {name:a.connectFromName||"Jonna Critchley", email:a.connectFrom||"jcritchley@mba.org"}; };
const isConnect = o=>(o.to||[]).some(r=>/@connectedcommunity\.org$/i.test((r&&r.email)||""));
const fromMe = o=>isConnect(o)||o.sendAs==="me";
const fromOf = o=>fromMe(o)? CONNECT_FROM().email : ELECTIONS_FROM;
const fromLabel = o=>isConnect(o)? CONNECT_FROM().name+" <"+CONNECT_FROM().email+">, so MISMO Connect accepts the post" : o.sendAs==="me"? CONNECT_FROM().name+" <"+CONNECT_FROM().email+">" : ELECTIONS_FROM;
const ATT_YEAR = c=>String((+((c||{}).year)||curYear())-1);   /* 2027 terms: attendance in 2026 */

/* ---------- Meeting Trackers ---------- */
const mtKey = s=>{ let x=String(s||"").toLowerCase().replace(/®/g,"").replace(/\(.*?\)/g,"").replace(/&/g," and ").replace(/\b(cop|dwg|workgroup)\b/g," ").replace(/[^a-z0-9]/g,""); return x; };
function mtFor(g){ if(!g) return null; if(g.mt && S.mt[g.mt]) return S.mt[g.mt]; if(g.type==="domain"||g.isNew) return null; const k=mtKey(g.mtName||g.name); return vals("mt").find(m=>mtKey(m.name)===k)||null; }
function groupLive(g){ if(!g || g.active===false) return false; const m=mtFor(g); return m? !m.archived : true; }
function mtState(g){ const m=mtFor(g); const y=ATT_YEAR(cyc("aof")); if(!m) return g&&g.isNew?{k:"new",label:"New",cls:"in"}:{k:"none",label:"Not in Meeting Trackers",cls:"wait"};
  if(m.archived) return {k:"arch",label:"Archived",cls:"changes"}; if(m.hold) return {k:"hold",label:"On Hold",cls:"review"};
  const n=(m.m||{})[y]||0; if(!n) return {k:"quiet",label:"No Meetings in "+y,cls:"review"}; return {k:"live",label:n+" Meetings in "+y,cls:"ok"}; }
function attendOf(name, gname, year, gt){
  const g=groupByName(gname, gt); const m=mtFor(g||{name:gname}); if(!m) return null;
  const y=year||ATT_YEAR(cyc("aof")); const held=(m.m||{})[y]||0; const a=(m.lead||m.p||{})[name];
  if(!a) return {held, att:null};
  return {held, att: Array.isArray(a)? (y==="2025"?a[0]:a[1]) : (a[y]||0)};
}
function attText(name,gname,gt){ const a=attendOf(name,gname,null,gt); if(!a||!a.held) return ""; return a.att==null?"":a.att+" of "+a.held+" meetings"; }
function mtSynced(){ const m=(S.settings.mt||{}); return m.at? (m.live?"Live from Meeting Trackers":"Meeting Trackers as of "+fS(m.at.slice(0,10))) : "Not linked to Meeting Trackers yet"; }
/* on resources.mismo.org: read Meeting Trackers' published feed through the relay */
let MT_LIVE=false;
async function loadMtLive(){
  if(!window.__hqMT || MT_LIVE) return; try{ const f=await window.__hqMT.load(); if(!f || !f.groups) return;
    const o={}; f.groups.forEach(g=>{ const id="mt-"+mtKey(g.n); o[id]={id, name:g.n, type:g.t, archived:!!g.a, hold:!!g.h, facilitator:g.f||"", last:g.last||"", m:g.m||{}, co:g.co||{}, p:g.p||{}}; });
    S.mt=o; S.settings.mt={at:f.at||new Date().toISOString(), live:true}; MT_LIVE=true; schedule(); }catch(e){}
}
/* member companies active in a group (and, for a domain, in every group under it) */
function activeCompanies(gname, gt){
  const g=groupByName(gname, gt); if(!g) return null;
  const parts = g.type==="domain"? vals("groups").filter(x=>x.domain===g.id && (x.type==="aof"||x.type==="tf")) : [g];
  let any=false; const set=new Set();
  parts.forEach(x=>{ const m=mtFor(x); if(m && m.co && Object.keys(m.co).length){ any=true; Object.keys(m.co).forEach(c=>set.add(norm(c))); } });
  return any? set : null;
}
function companyIn(set, company){ const n=norm(company); if(!n) return false; if(set.has(n)) return true; for(const c of set){ if(c && (c.indexOf(n)>=0 || n.indexOf(c)>=0)) return true; } return false; }
/* ballots from a company that hasn't attended are held for a look */
const _voteStatus = voteStatus;
voteStatus = function(c){
  const out=_voteStatus(c); if(!MULTI(c.type)) return out;
  votesOf(c).forEach(v=>{ const st=out[v.id]; if(!st || st.manual || st.k!=="counted") return; const set=activeCompanies(v.group, c.type); if(!set) return;
    if(!companyIn(set,(v.voter||{}).company)) out[v.id]=Object.assign({},st,{k:"hold", why:"Company hasn't attended "+v.group+" in "+ATT_YEAR(c)}); });
  return out;
};

  const domOf=g=>{ const gp=groupByName(g,c.type); const d=gp&&S.groups[gp.domain]; return gp&&gp.type==="domain"? gp.name : (d?d.name:"Not in a Domain"); };
  const cnt={all:groups.length, gap:0, conf:0, ok:0, con:0};
  const byG={}; groups.forEach(g=>{ const gs=ss.filter(s=>s.group===g).sort((a,b)=>POSITIONS.indexOf(a.position)-POSITIONS.indexOf(b.position)); const cls=gs.map(seatCls); byG[g]={gs,cls}; ["gap","conf","ok","con"].forEach(k=>{ if(cls.includes(k)) cnt[k]++; }); });

      show.map(g=>'<tr><td class="mn" data-cop="'+esc(g)+'">'+esc(g)+'</td>'+(isA?'<td class="note">'+esc(domOf(g))+'</td>':'')+byG[g].gs.map((s,i)=>{ const ns=liveNoms(s.id);
        return '<td class="mc '+byG[g].cls[i]+'" data-seat="'+esc(s.id)+'">'+(ns.length? esc(ns.map(fullName).join(", ")) : "No nominee")+'</td>'; }).join("")+'<td class="note">'+esc(byG[g].gs.flatMap(s=>(s.incumbents||[]).map(x=>x.name)).filter((v,i,a)=>a.indexOf(v)===i).join(", ")||"New")+'</td></tr>').join("")+'</tbody></table></div></div>';
  } else {
    const dOrder=n=>{ const d=vals("groups").find(x=>x.type==="domain"&&x.name===n); return d?(d.order||0):99; }; const doms=isA? [...new Set(show.map(domOf))].sort((a,b)=>dOrder(a)-dOrder(b)||byName(a,b)) : [""];

        const inc=gs.flatMap(s=>s.incumbents||[]).filter((v,i,a)=>a.findIndex(x=>x.name===v.name)===i);
        return '<button type="button" class="gcard" data-cop="'+esc(g)+'"><div class="gh"><b>'+esc(g)+'<small>'+esc((gp&&gp.facilitator)||"No facilitator listed")+(st&&st.k!=="none"?" · "+st.label:"")+'</small></b></div>'+

const slugify = s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"x";
function eventDrafts(){
  const out=[]; const y=curYear();
  const cs=TYPE_KEYS.map(k=>cyc(k)).filter(c=>c && c.type!=="board");
  cs.forEach(c=>{
    const ruleOf=k=>RULES.find(r=>r[0]===k && (r[1]==="*"||r[1]===c.type));
    /* ask every new nominee to confirm */
    const rc=ruleOf("confirmAsk"); if(rc && ruleMode(rc)!=="off") vals("nominations").filter(n=>n.cycle===c.id && n.status==="received" && n.email && n.aware!=="yes").forEach(n=>{
      const s=S.seats[n.seat]; const t=tplFor(c.type,"confirmAsk"); if(!t||!s) return;
      out.push({rule:RULE_KEY(rc), ruleLabel:rc[2], mode:ruleMode(rc), id:c.id+"__confirm__"+n.id, cycle:c.id, nomination:n.id, needsToken:true, to:[{name:fullName(n),email:n.email}],
        subject:mergeText(t.subject,c,{group:s.group,seat:s.position,first:n.first||""}), bodyTpl:t.body, extra:{group:s.group,seat:s.position,first:n.first||""}}); });
    /* one company, one vote */
    const rd=ruleOf("dupe"); if(rd && ruleMode(rd)!=="off"){ const st=voteStatus(c); const groups={}; votesOf(c).forEach(v=>{ const x=st[v.id]; if(x && x.dup) (groups[x.key]=groups[x.key]||[]).push(v); });
      Object.entries(groups).forEach(([k,vs])=>{ const t=tplFor(c.type,"dupe"); if(!t) return; out.push({rule:RULE_KEY(rd), ruleLabel:rd[2], mode:ruleMode(rd), id:c.id+"__dupe__"+slugify(k), cycle:c.id, to:vs.filter(v=>(v.voter||{}).email).map(v=>({name:fullName(v.voter),email:v.voter.email})), subject:mergeText(t.subject,c,{group:vs[0].group||TYPES[c.type].name}), body:mergeText(t.body,c,{group:vs[0].group||TYPES[c.type].name})}); }); }

      const ex={group:s.group, seat:s.position, first:n.first||"", chairNote: c.type==="domain"&&s.position==="Chair"?" As a Domain Chair you also sit on the Council of Chairs, which coordinates across domains.":""};
      out.push({rule:RULE_KEY(r), ruleLabel:r[2], mode:ruleMode(r), id:c.id+"__"+(won?"won":"thanks")+"__"+n.id, cycle:c.id, to:[{name:fullName(n),email:n.email}], subject:mergeText(tp.subject,c,ex), body:mergeText(tp.body,c,ex)}); }); }); }
  });

/* runs quietly whenever Elections HQ is open: drafts what's due, applies confirmations */
let PILOT_AT=0, PILOT_BUSY=false;
async function autopilot(){
  if(PILOT_BUSY || !LIVE || !CANWRITE || Date.now()-PILOT_AT<45000) return;
  if(!["cycles","seats","nominations","outbox","settings","responses"].every(c=>LOADED.has(c))) return;
  PILOT_BUSY=true; PILOT_AT=Date.now();
  try{
    const t=T();
    /* 1. nominees who answered the confirmation link */
    for(const r of vals("responses")){ const n=S.nominations[r.n||r.nomination]; if(!n || n.answeredAt || !n.token || r.t!==n.token) continue;
      const yes=String(r.answer||"").toLowerCase().startsWith("y");
      await patch("nominations",n.id,{status:yes?"confirmed":"declined", aware:yes?"yes":"no", answeredAt:r.at||new Date().toISOString(), answerNote:r.note||""}); }
    /* 2. drafts for the dated steps (from the day before the step, for up to three weeks after) */
    for(const c of TYPE_KEYS.map(k=>cyc(k)).filter(c=>c && c.type!=="board")){
      for(const r of RULES.filter(r=>(r[1]===c.type) && r[3]!=="event")){
        const d=cdate(c,r[3]); if(!d || ruleMode(r)==="off") continue; if(t<add(d,-1) || t>add(d,21)) continue;
        for(const o of draftsFor(c,r)) if(!S.outbox[o.id]) await putOut(o.id,Object.assign(o,{status:ruleMode(r)==="auto"?"scheduled":"draft", createdAt:new Date().toISOString(), sendAfter:d, auto:true}));
      }
    }
    /* 3. drafts for things that happen (new nominee, duplicate ballots, results) */
    for(const o of eventDrafts()){ if(S.outbox[o.id]) continue;
      if(o.needsToken){ const n=S.nominations[o.nomination]; let tok=n.token; if(!tok){ tok=token(); await patch("nominations",n.id,{token:tok}); }
        o.body=mergeText(o.bodyTpl,S.cycles[o.cycle],Object.assign({},o.extra,{confirmLink:confirmLink(Object.assign({},n,{token:tok}))})); delete o.bodyTpl; delete o.extra; delete o.needsToken; }
      const mode=o.mode; delete o.mode;
      await putOut(o.id,Object.assign(o,{status:mode==="auto"?"scheduled":"draft", createdAt:new Date().toISOString(), sendAfter:t, auto:true})); }
  }catch(e){ console.error(e); }
  PILOT_BUSY=false;
}

  const ms=MILES[c.type]||[]; const out=[]; let prev=null;
  ms.forEach(([k,l])=>{ const d=dates[k]; if(!d) return;
    if(k==="termStart"){ if(offDay(d)&&false){} return; }  /* terms begin January 1, before or after orientation */
    if(prev && d<prev.d) out.push({k, bad:true, msg:"<b>"+esc(l)+"</b> ("+esc(fLong(d))+") is now before <b>"+esc(prev.l)+"</b> ("+esc(fLong(prev.d))+")."});
    if(offDay(d)) out.push({k, msg:"<b>"+esc(l)+"</b> falls on "+(HOLIDAYS[d]?esc(HOLIDAYS[d])+", a MISMO holiday":"a weekend")+"."});
    prev={d,l}; });
  const span=(a,b)=>dates[a]&&dates[b]?dayGap(dates[a],dates[b]):null;
  const nw=span("nomOpen","nomClose"); if(nw!==null && nw>=0 && nw<7) out.push({k:"nomClose", msg:"Nominations are open only "+dayWord(nw)+"."});
  const bw=span("ballotOpen","ballotClose"); if(bw!==null && bw>=0 && bw<5) out.push({k:"ballotClose", msg:"Voting is open only "+dayWord(bw)+"."});
  if(dates.ballotClose && dates.announce && dates.announce<dates.ballotClose) {} /* covered by the order check */
  return out;
}

/* what a change touches */
function impactsOf(c, changed){
  const ms=(MILES[c.type]||[]).map(m=>m[0]); const label=k=>((MILES[c.type]||[]).find(m=>m[0]===k)||[k,k])[1];
  const dated=changed.filter(x=>x.from && x.to);
  const out={shift:[], tasks:[], drafts:[], sent:[], linked:[], form:false};
  /* the steps after each moved date: only those that would now be out of order move, by the same
     number of days, and each one moved can push the next. Term start and orientation never move. */
  const FIXED=["termStart","orient"];
  dated.forEach(x=>{ const delta=dayGap(x.from,x.to); if(delta<=0) return; const i=ms.indexOf(x.k); let floor=x.to;
    for(const k of ms.slice(i+1)){ if(changed.some(y=>y.k===k)){ floor=cdate(c,k)||floor; continue; } const d=cdate(c,k); if(!d) continue;
      const already=out.shift.find(s=>s.k===k); const cur=already?already.to:d;
      if(cur>=floor){ floor=cur; if(!already) break; continue; }
      if(FIXED.includes(k)){ out.fixed=(out.fixed||[]).concat([{k,l:label(k),d}]); continue; }
      const to=workday(add(d,delta),1);
      if(already) already.to=to; else out.shift.push({k, l:label(k), from:d, to, conflict:true, by:x.l, delta});
      floor=to; } });
  const allMoves=()=>changed.concat(out.shift);
  /* tasks due on an old date */
  dated.forEach(x=>{ vals("tasks").filter(t=>t.cycle===c.id && !t.done && t.due===x.from).forEach(t=>out.tasks.push({id:t.id, title:t.title, from:x.from, to:x.to})); });
  /* drafts dated on, or mentioning, an old date */
  const mentions=(o,d)=>{ const txt=(o.subject||"")+"\n"+(o.body||""); return [fLong(d),fL(d),fS(d)].filter(Boolean).some(f=>txt.includes(f)); };
  vals("outbox").filter(o=>o.cycle===c.id).forEach(o=>{ const st=outStatus(o);
    const hits=dated.filter(x=>o.sendAfter===x.from || mentions(o,x.from));
    if(!hits.length) return;
    if(st==="sent"||st==="send") out.sent.push({id:o.id, subject:o.subject, dates:hits});
    else if(st!=="skipped") out.drafts.push({id:o.id, subject:o.subject, dates:hits}); });
  /* the other election that shares the announcement and nomination window */
  const lt=LINKED_TYPE[c.type]; const lc=lt? vals("cycles").find(x=>x.type===lt && String(x.year)===String(c.year)) : null;
  if(lc) changed.forEach(x=>{ if(x.from && cdate(lc,x.k)===x.from) out.linked.push({k:x.k, l:label(x.k), cycle:lc.id, to:x.to}); });
  out.linkedCycle=lc;
  out.form=changed.some(x=>["nomOpen","nomClose","ballotOpen","ballotClose"].includes(x.k));
  out.allMoves=allMoves;
  return out;
}

function openImpact(c, changed){
  const im=impactsOf(c, changed);
  const li=(a)=>'<ul class="imp">'+a.join("")+'</ul>';
  const moved=li(changed.map(x=>'<li><b>'+esc(x.l)+'</b>: '+(x.from?esc(fLong(x.from)):"no date")+' &rarr; '+(x.to?esc(fLong(x.to)):"no date")+'</li>'));
  const fields=[]; const extra=[];
  const conflicts=im.shift.filter(s=>s.conflict);
  if(im.shift.length){ fields.push({k:"shift",type:"cb",label:"Move the "+plural(im.shift.length,"step")+" that would now be out of order (each by "+dayWord(im.shift[0].delta)+", to a workday)",get:()=>true, wide:true});
    fields.push({k:"shiftList",type:"html",wide:true,html:()=>li(im.shift.map(s=>'<li><b>'+esc(s.l)+'</b>: '+esc(fLong(s.from))+' &rarr; '+esc(fLong(s.to))+'</li>'))}); }
  if(im.fixed&&im.fixed.length) extra.push('<div class="dt-warn" style="margin-top:14px"><b class="dt-h">These stay put</b>'+li(im.fixed.map(f=>'<li><b>'+esc(f.l)+'</b> is '+esc(fLong(f.d))+'. It doesn\'t move with other dates; change it yourself if it has to.</li>'))+'</div>');
  if(im.tasks.length) fields.push({k:"tasks",type:"cb",label:"Move "+plural(im.tasks.length,"task")+" due on the old date",get:()=>true,wide:true},
    {k:"taskList",type:"html",wide:true,html:()=>li(im.tasks.map(t=>'<li>'+esc(t.title)+': '+esc(fS(t.from))+' &rarr; '+esc(fS(t.to))+'</li>'))});
  if(im.drafts.length) fields.push({k:"drafts",type:"cb",label:"Update "+plural(im.drafts.length,"draft")+" in the Outbox (send date and the dates in the message)",get:()=>true,wide:true},
    {k:"draftList",type:"html",wide:true,html:()=>li(im.drafts.map(o=>'<li>'+esc(o.subject||"")+'</li>'))});
  if(im.linked.length) fields.push({k:"linked",type:"cb",label:"Change the same "+plural(im.linked.length,"date")+" for "+TYPES[LINKED_TYPE[c.type]].name+" (they share it today)",get:()=>true,wide:true},
    {k:"linkedList",type:"html",wide:true,html:()=>li(im.linked.map(x=>'<li><b>'+esc(x.l)+'</b> &rarr; '+esc(fLong(x.to))+'</li>'))});
  if(im.form) fields.push({k:"form",type:"cb",label:window.__hqPublic?"Update the nomination form's open and close dates on the website":"Save a new nomination form file (this copy can't publish to the website)",get:()=>!!window.__hqPublic,wide:true});
  if(im.sent.length) extra.push('<div class="dt-warn" style="margin-top:14px"><b class="dt-h">Already sent with the old date</b>'+li(im.sent.map(o=>'<li>'+esc(o.subject||"")+': it gave '+o.dates.map(x=>esc(fLong(x.from))).join(", ")+'</li>'))+'<span class="note">Consider a short correction to the same people. Use Draft Now in the Outbox, or write one.</span></div>');
  const issues=dateIssues(c,c.dates||{});
  if(!fields.length && !extra.length){ closePane(true); toast(issues.length?"Saved. Check the dates flagged on the timeline":"Dates saved. Nothing else was affected"); return; }
  openPane({eye:TYPES[c.type].name+" · "+c.year, title:"What This Change Affects", noDirty:true, noFocus:true,
    top:'<div class="fsec" style="margin-top:0">You Changed</div>'+moved+(fields.length?'<div class="fsec">Also Change?</div><p class="note" style="margin:0 0 8px">Only what\'s ticked moves.</p>':''),
    fields, extra:extra.join("")+'<div id="dt-after" style="margin-top:12px">'+(issues.length?issuesHtml(issues):'')+'</div>',
    saveLabel:"Apply", savedMsg:"Done",
    buttons:[{label:"Leave Everything Else", run:async()=>{ closePane(true); toast("Only the dates you changed were moved"); }}],
    save:async v=>{
      let dates=Object.assign({},c.dates||{}); const moves=changed.slice();
      if(v.shift){ im.shift.forEach(s=>{ dates[s.k]=s.to; moves.push(s); }); await patch("cycles",c.id,{dates}); }
      const toOf={}; moves.forEach(m=>{ if(m.from && m.to) toOf[m.from]=toOf[m.from]||m.to; });
      if(v.tasks){ for(const t of im.tasks) await patch("tasks",t.id,{due:t.to}); }
      if(v.shift && v.tasks){ for(const s of im.shift) for(const t of vals("tasks").filter(t=>t.cycle===c.id && !t.done && t.due===s.from)) await patch("tasks",t.id,{due:s.to}); }
      if(v.drafts){ const swap=(txt)=>{ let s=String(txt||""); Object.entries(toOf).forEach(([f,t])=>{ s=s.split(fL(f)).join(fL(t)).split(fLong(f)).join(fLong(t)); }); return s; };
        const ids=new Set(im.drafts.map(o=>o.id));
        if(v.shift) vals("outbox").filter(o=>o.cycle===c.id && !["sent","send","skipped"].includes(outStatus(o)) && im.shift.some(s=>o.sendAfter===s.from)).forEach(o=>ids.add(o.id));
        for(const id of ids){ const o=S.outbox[id]; if(!o) continue; await putOut(id,Object.assign({},o,{subject:swap(o.subject), body:swap(o.body), sendAfter:toOf[o.sendAfter]||o.sendAfter})); } }
      if(v.linked && im.linkedCycle){ const lc=im.linkedCycle; const ld=Object.assign({},lc.dates||{});
        moves.forEach(m=>{ if(m.from && cdate(lc,m.k)===m.from) ld[m.k]=m.to; }); await patch("cycles",lc.id,{dates:ld});
        if(v.tasks) for(const m of moves) for(const t of vals("tasks").filter(t=>t.cycle===lc.id && !t.done && t.due===m.from)) await patch("tasks",t.id,{due:m.to}); }
      if(v.form){ try{ await publishNominate(); }catch(e){} }
      const after=dateIssues(Object.assign({},c,{dates}),dates);
      if(after.some(x=>x.bad)) setTimeout(()=>toast("Some dates are still out of order. Open Change Dates to fix them",6000),400);
    }});
}

/* ======================= CERTIFYING THE RESULTS (MBA LEGAL) =======================
   Every year the Governance Committee results go to MBA Legal, as a third party, to confirm the
   election was fair. Elections HQ drafts a heads-up when the Call for Vote goes out and, on the
   audit date, the Request to Certify: the process with its dates, what came in, any company that
   voted twice, any tie, and each seat's result, with the ballot breakdown and the count attached.
   Both come from Jonna's own address. The reviewer is set in Outbox > Addresses. */
const LEGAL = ()=>{ const a=(typeof S!=="undefined"&&S.settings&&S.settings.automation)||{}; return Object.assign({name:"",email:""}, a.legal||{}); };
const SIGNATURE = "Jonna Critchley\nDirector, Programs and Operations, MISMO\n1919 M Street NW, 5th Floor | Washington, DC 20036\nTEL: (202) 557-2763 | mismo.org";
const csvOf = rows=>rows.map(r=>r.map(x=>{ x=String(x==null?"":x); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }).join(",")).join("\r\n");
function certFiles(c){
  const t=tally(c), st=voteStatus(c), body=c.year+" MISMO "+TYPES[c.type].name+" Election";
  const roll=voterRoll(c); const roleOf=v=>{ const e=String((v.voter||{}).email||"").toLowerCase(); const r=roll.find(x=>(x.code&&x.code===v.code)||String(x.email||"").toLowerCase()===e); return r? String(r.role||r.list||"").toUpperCase() : ""; };
  const nameOf=id=>{ const n=S.nominations[id]||{}; return fullName(n); };
  const b=[["Ballot","Submitted (Eastern)","Voter","Role","Email","Company","Group","Choices","Counted","Why Not Counted"]];
  votesOf(c).forEach(v=>{ const x=st[v.id]||{}; const picks=Object.entries(v.choices||{}).map(([sid,p])=>{ const s=S.seats[sid]; return (s?(s.group&&MULTI(c.type)?s.group+" ":"")+s.position:"")+": "+(Array.isArray(p)?p:[p]).map(nameOf).join("; "); }).join(" | ");
    b.push([v.id, v.submittedAt||"", fullName(v.voter||{}), roleOf(v), (v.voter||{}).email||"", (v.voter||{}).company||"", v.group||"", picks, x.k==="counted"?"Yes":"No", x.k==="counted"?"":(x.why||x.k||"")]); });
  const k=[["Seat","Nominee","Company","Votes","Elected"]];
  seatsOf(c).filter(s=>(s.round||1)===1).forEach(s=>{ const w=winnersOf(c,s,t); Object.keys(t[s.id]||{}).sort((a,b2)=>t[s.id][b2]-t[s.id][a]).forEach(i=>{ const n=S.nominations[i]||{}; k.push([seatLabel(s), fullName(n), n.company||"", t[s.id][i], w.ids.includes(i)?"Yes":"No"]); }); });
  return [{name:body+" - Ballot Breakdown.csv", contentType:"text/csv", content:csvOf(b)}, {name:body+" - Results.csv", contentType:"text/csv", content:csvOf(k)}];
}
function certBody(c){
  const L=LEGAL(), d=k=>fLong(cdate(c,k)), t=tally(c), st=voteStatus(c), vs=votesOf(c);
  const counted=vs.filter(v=>(st[v.id]||{}).k==="counted");
  const companies=new Set(vs.map(v=>norm((v.voter||{}).company)).filter(Boolean));
  let s="Hi "+(L.name?L.name.split(" ")[0]:"there")+",\n\nI hope your week is off to a great start!\n\nAs a reminder, we're forwarding the results of MISMO's "+c.year+" "+TYPES[c.type].name+" election for you, as a third party, to verify and confirm it was fair.\n\nTHE PROCESS\n";
  if(c.type==="goc"){
    s+="We announced a Call for Nominations to all MISMO members through a MISMO Connect community notification on "+d("nomOpen")+"."+(cdate(c,"release")?" MBA Public Affairs announced the nomination period through an MBA press release as well.":"")+(cdate(c,"reminder")?" A reminder went out on "+d("reminder")+" to encourage anyone who had not yet nominated to do so":" Nominations were open")+" before the midnight Eastern deadline on "+d("nomClose")+".\n\n";
    s+="On "+d("ballotOpen")+", a Call for Vote went out with a personal ballot link to every MISMO Voting Representative (MVR) and MISMO Voting Alternate (MVA), asking for ONE vote from each company for the listed nominees. They were told that an organization is entitled to submit only one ballot, and that should both a Voting Representative and an Alternate submit ballots, the Alternate's ballot will be dismissed. Voting closed at midnight Eastern on "+d("ballotClose")+".\n\n";
  } else {
    s+="Nominations opened on "+d("nomOpen")+" through MISMO Connect and closed on "+d("nomClose")+(cdate(c,"lastCall")?", with a last call for changes until "+d("lastCall"):"")+". Every nominee confirmed they would serve before the ballot went out.\n\nBallots were open from "+d("ballotOpen")+" to "+d("ballotClose")+", with one vote for each member company that took part in the group that year.\n\n";
  }
  s+=plural(vs.length,"ballot")+" came in from "+plural(companies.size,"company","companies")+"; "+counted.length+" counted.\n\nTHE RESULTS\nAttached you will find:\n"+certFiles(c).map(f=>"- "+f.name.replace(/\.csv$/,"")+" (Excel)").join("\n")+"\n";
  /* a company that voted more than once */
  const groups={}; vs.forEach(v=>{ const x=st[v.id]||{}; if(x.key) (groups[x.key]=groups[x.key]||[]).push(v); });
  const notes=[];
  Object.values(groups).filter(g=>g.length>1).forEach(g=>{ const kept=g.filter(v=>(st[v.id]||{}).k==="counted"); const out=g.filter(v=>(st[v.id]||{}).k!=="counted"); const co=(g[0].voter||{}).company||"One company";
    notes.push(co+" voted more than once. "+(kept.length?"We counted "+kept.map(v=>fullName(v.voter||{})).join(", ")+"'s ballot and not "+out.map(v=>fullName(v.voter||{})).join(", ")+"'s.":"Neither ballot is counted yet.")); });
  seatsOf(c).forEach(se=>{ const w=winnersOf(c,se,t); const why=((c.results||{})[se.id]||{}).why; if(w.tie||why) notes.push("There was a tie for "+(MULTI(c.type)?se.group+" "+se.position:se.position)+"."+(why?" "+why:" It still needs settling.")); });
  if(notes.length) s+="\nPlease note:\n"+notes.map(n=>"- "+n).join("\n")+"\n";
  s+="\nHere is a summary of the results:\n";
  seatsOf(c).filter(se=>(se.round||1)===1).forEach(se=>{ const w=winnersOf(c,se,t); const all=onBallot(se.id); const nm=n=>fullName(n)+(n.company?", "+n.company:"");
    const won=w.ids.map(i=>S.nominations[i]).filter(Boolean), lost=all.filter(n=>!w.ids.includes(n.id));
    s+="- "+seatPhrase(c,se)+"\n    - Elected: "+(won.length?andList(won.map(nm)):"none yet")+"\n    - Not elected: "+(lost.length?andList(lost.map(nm)):"Not applicable")+"\n"; });
  s+="\nPlease reach out with any questions; otherwise, please return your certification no later than close of business "+(d("certDue")||d("calls"))+".\n\nThank you for your time and support!\n\n"+SIGNATURE;
  return s;
}
function andList(a){ const sep=a.some(x=>x.includes(","))?"; ":", "; return a.length<3? a.join(" and ") : a.slice(0,-1).join(sep)+(sep==="; "?"; and ":" and ")+a[a.length-1]; }
function seatPhrase(c,se){ const n=+se.count||1; const pos=n>1&&!/s$/.test(se.position)? se.position+"s" : se.position; const pos2=c.type==="goc"? pos.replace(/^Governance Committee /,"") : pos;
  return n+" "+(c.type==="goc"? pos2+(/committee/i.test(pos2)?"":" of the Governance Committee") : (MULTI(c.type)? pos2+" for "+se.group : pos2)); }
function certDrafts(c){ const L=LEGAL(); return [{id:c.id+"__certify", cycle:c.id, rule:c.type+".certify", ruleLabel:"Request to Certify the Results", sendAs:"me",

/* ======================= FLOW ADDRESSES =======================
   Two Power Automate flows connect Elections HQ to the world:
   - "Elections Forms": the public forms post to it; it hands each entry to GitHub, where a workflow
     in elections-hq-data files it (nomsubs, responses, votes). Its address is published in
     slates/forms.json so the forms can find it (it's meant to be public, like every form's).
   - "Elections Send Email": the Outbox workflow in elections-hq-data sends each message through it.
     Its address stays private, in settings (data/settings.json in elections-hq-data).
   Each address is pasted once here, from the flow's trigger in Power Automate. */
function flowState(){ const a=(S.settings&&S.settings.automation)||{}; return {forms:a.formsUrl||"", send:a.sendUrl||"", mailbox:a.mailbox||"elections@mba.org"}; }
function openFlows(){ const f=flowState();
  openPane({eye:"Public Forms", title:"Flow Addresses", data:{}, noFocus:true,
    top:'<p class="note" style="margin:0 0 12px">Paste each address once. In Power Automate, open the flow, select <b>When an HTTP request is received</b> (shown as manual) and copy <b>HTTP URL</b>.</p><div class="kv" style="margin-bottom:12px"><dt>Elections Forms</dt><dd>'+(f.forms?'<span class="chip ok">Set</span> The nomination, confirmation and ballot pages send to it':'<span class="chip changes">Not set</span> The forms say they open in a few days until it is')+'</dd><dt>Elections Send Email</dt><dd>'+(f.send?'<span class="chip ok">Set</span> The Outbox sends through it':'<span class="chip changes">Not set</span> Nothing can send until it is')+'</dd></div>',
    fields:[{k:"forms",label:"Elections Forms: HTTP URL",type:"textarea",rows:3,get:()=>f.forms,hint:"Published for the public forms to use"},
      {k:"send",label:"Elections Send Email: HTTP URL",type:"textarea",rows:3,get:()=>f.send,hint:"Kept private, in Elections HQ's records"},
      {k:"mailbox",label:"Elections Mailbox",get:()=>f.mailbox,hint:"The shared mailbox everything else sends from (shown to people as elections@mismo.org)"}],
    save:async v=>{ const clean=x=>String(x||"").trim().replace(/\s+/g,"");
      const forms=clean(v.forms), send=clean(v.send);
      if((forms && !/^https:\/\//.test(forms)) || (send && !/^https:\/\//.test(send))) throw new Error("Each address starts with https://");
      const a=Object.assign({},S.settings.automation||{},{formsUrl:forms, sendUrl:send, mailbox:(v.mailbox||"elections@mba.org").trim()});
      await put("settings","automation",a);
      if(window.__hqPublic && window.__hqPublic.save){ try{ await window.__hqPublic.save("slates/forms.json",{endpoint:forms, at:new Date().toISOString()}); toast("Saved. The forms use the new address within a minute"); }catch(e){ toast("Saved here, but couldn't publish for the forms: "+(e.message||"try again"),6000); } }
      else toast("Saved. Publish from resources.mismo.org so the forms can use it"); }});
}
const _renderFormsF = renderForms;
renderForms = function(){ _renderFormsF(); const el=$("#page-forms"); if(!el) return; const f=flowState();
  const card=document.createElement("div"); card.className="card"; card.style.marginTop="22px";
  card.innerHTML='<div class="ch"><h2>Flow Addresses</h2><span class="note">how the forms and the Outbox reach Power Automate</span><div class="r"><button class="btn sm'+(f.forms&&f.send?'':' pri')+'" type="button" id="fm-flows">'+(f.forms&&f.send?'Change':'Set Them')+'</button></div></div><div class="checks">'+
    '<div class="chk"><span class="ct"><b>Elections Forms</b><small>'+(f.forms?'Set. Entries from the three public forms go through it into elections-hq-data.':'Not set yet. The forms say they open in a few days until it is.')+'</small></span></div>'+
    '<div class="chk"><span class="ct"><b>Elections Send Email</b><small>'+(f.send?'Set. The Outbox sends through it, from '+esc(f.mailbox)+' or your own mailbox.':'Not set yet. Nothing in the Outbox can go out until it is.')+'</small></span></div></div>';
  el.appendChild(card); $("#fm-flows",card).onclick=()=>openFlows(); };

/* ================= Start the next election year ================= */
function openStartYear(){
  const ys=years(); const next=(vals("cycles").length? Math.max(...ys)+1 : today().getFullYear()+1);
  openPane({eye:"Elections HQ", title:"Start the "+next+" Election Year", data:{year:next, types:{domain:true,aof:true,goc:true,board:true}},
    top:'<p>This sets up the elections for terms beginning January 1, '+next+'. Dates move forward a year from '+(next-1)+' (landing on the same weekday), tasks are copied with every box unticked, and CoP positions are built from the Leadership Roster with each current leader shown as serving now. Nothing from '+(next-1)+' is changed.</p>',
    fields:[{k:"year",label:"Terms Begin",type:"number"},{k:"types",label:"Elections to Set Up",type:"checks",opts:TYPE_KEYS.map(k=>[k,TYPES[k].name])}],
    saveLabel:"Set It Up",
    save:async v=>{ const y=+v.year; if(!y) throw new Error("Enter the year terms begin.");
      let made=0; for(const k of Object.keys(v.types||{})){ if(S.cycles[y+"-"+k]) continue; await buildCycle(k,y); made++; }
      CY=y; toast(made?plural(made,"election")+" set up for "+y:"Already set up", 4000); }});
}
async function buildCycle(type,y){
  const prev=S.cycles[(y-1)+"-"+type]; const id=y+"-"+type;
  const shift=d=>d? add(d,364) : "";
  const dates={}; (MILES[type]||[]).forEach(([k])=>{ dates[k]= prev&&prev.dates&&prev.dates[k] ? workday(shift(prev.dates[k])) : ""; });
  if(!dates.termStart) dates.termStart=y+"-01-01"; else dates.termStart=y+"-01-01";
  await put("cycles",id,{type, year:y, dates, forms:{nominate:"auto", ballot:"auto"}, notes:""});
  /* seats */
  const incOf=(gname,pos)=>vals("leaders").filter(l=>l.status!=="former" && l.group===gname && posMatch(l.position,pos)).map(l=>({name:l.name, company:l.company||"", termLimit:l.termLimit||"", leader:l.id}));
  if(type==="aof"){
    /* one Co-Chair seat (two people) for every Area of Focus that is on the structure and still meeting */
    for(const g of groupsOf("aof").filter(g=>groupLive(g))) await put("seats",id+"__"+g.id,{cycle:id, group:g.name, position:"Co-Chair", count:2, order:0, round:1, termYears:+(g.termYears||1), incumbents:incOf(g.name,"Co-Chair")});
  } else if(type==="domain"){
    for(const g of groupsOf("domain")) for(let i=0;i<DOMAIN_SEATS.length;i++) await put("seats",id+"__"+g.id+"__"+i,{cycle:id, group:g.name, position:DOMAIN_SEATS[i], count:1, order:i, round:1, termYears:+(g.termYears||1), incumbents:incOf(g.name,DOMAIN_SEATS[i])});
  } else if(prev && type!=="board"){
    for(const s of seatsOf(prev)){ const inc=incOf(s.group,(s.round||1)===1&&type==="goc"?"Member":s.position);
      await put("seats",uid("s"),{cycle:id, group:s.group, position:s.position, count:s.count, round:s.round||1, order:s.order||0, termYears:s.termYears||1, notes:s.notes||"", incumbents:inc}); }
  } else if(type==="goc"){
    await put("seats",id+"__members",{cycle:id, group:"Governance Committee", position:"Governance Committee Member", count:5, round:1, termYears:2});
    await put("seats",id+"__chair",{cycle:id, group:"Governance Committee", position:"Chair", count:1, round:2, termYears:1});
    await put("seats",id+"__vice",{cycle:id, group:"Governance Committee", position:"Vice Chair", count:1, round:2, termYears:1});
  }
  /* tasks */
  if(prev){ for(const t of vals("tasks").filter(x=>x.cycle===prev.id)) await put("tasks",uid("t"),{cycle:id, title:t.title, phase:t.phase||"before", order:t.order||0, owner:t.owner||"", notes:t.notes||"", due:t.due?workday(shift(t.due)):"", done:false}); }
  else { const ph={nomOpen:"nominate",gaps:"nominate",nomClose:"nominate",posted:"nominate",lastCall:"nominate",confirm:"nominate",ballotOpen:"vote",ballotClose:"vote",dupCheck:"vote",announce:"after",orient:"after",termStart:"after"};
    for(const [k,l,w] of (MILES[type]||[])) await put("tasks",uid("t"),{cycle:id, title:l, notes:w||"", phase:ph[k]||"before", due:dates[k]||"", done:false}); }
}

/* ================= Help ================= */
const HELP=[
  ["Getting Started","How Elections HQ is laid out",'<p>Each election has its own page: <b>Business Domains</b>, <b>Areas of Focus</b>, the <b>Governance Committee</b> and the <b>Board of Directors</b>. The pages under Running the Elections work across all of them: Nominations, Ballots and Results, the <b>Outbox</b>, Timeline and Tasks, Communications and Onboarding. Records holds the Structure, the Leadership Roster, Voter Lists and the Public Forms.</p><p>An election year is the year terms begin: the 2027 election year runs nominations and voting in the fall of 2026, and uses 2026 attendance from Meeting Trackers.</p><p>Pages with an <b>(i)</b> beside the title show what MISMO\'s Bylaws say about that election.</p>'],
  ["Getting Started","The new structure",'<p>Communities of Practice become <b>Areas of Focus</b> (two elected Co-Chairs and a staff facilitator). Development Workgroups become <b>Task Forces</b> (a Lead set by the domain, an optional Co-Lead, a Requestor Sponsor and a facilitator; not elected). Each sits in one of eight <b>Business Domains</b>, which elect a Chair, a Vice Chair and a Care and Feeding Lead. The Council of Chairs is now the Domain Chairs only, the Business Executive Team becomes the Board\'s Prioritization Committee, and from 2027 the Residential and Commercial Standards Governance Committees become one five-person <b>Governance Committee</b>, which confirms the process was followed.</p><p>Groups archived in Meeting Trackers or Higher Logic (Fee Modernization, for one) are marked inactive on the Structure page, so they get no seat, no ballot email and no post.</p>'],
  ["Getting Started","Starting a new year",'<p>On the Election Year page, press <b>Start the Next Election Year</b>. Dates move forward a year onto the same weekday, tasks are copied with every box unticked, and seats are rebuilt: two Co-Chairs for every Area of Focus still meeting, and three seats for every Business Domain. After that, every date is yours to change.</p>'],
  ["Getting Started","Changing dates",'<p>Open <b>Dates and Forms</b> on any election, or click a date on its timeline, and move anything, as often as you need. As you type, anything out of order, on a weekend or MISMO holiday, or squeezing nominations or voting too short is flagged.</p><p>When you save, Elections HQ lists what the change touches, each with a tick box, and only what you tick moves: the later steps that would now be out of order, tasks due on the old date, Outbox drafts (their send date and the dates written in them), the same date for the Business Domains or Areas of Focus, and the nomination form\'s open and close dates. Terms Begin and Orientation never move on their own. Emails already sent with the old date are listed so you can send a correction.</p>'],
  ["How It\'s Connected","Where Elections HQ lives",'<p>Elections HQ runs at <b>resources.mismo.org/elections-hq/</b> with the shared resources.mismo.org sign-in. Who can open it and who can change things is set per person in <b>People &amp; Access</b> (Admin and Staff change anything; View is read-only).</p><ul><li>The page is in the public GitHub repository <b>GitMISMO/elections-hq</b>. It holds no records.</li><li>Every record is in the private repository <b>GitMISMO/elections-hq-data</b>, read and saved through the resources.mismo.org save relay (project <b>elections-hq</b>). Every save is a commit, so there is history.</li><li>What the public forms need (the open seats, and each ballot\'s confirmed nominees) is published to <b>elections-hq/slates/</b> through a second relay project, <b>elections-hq-public</b>, which can write nothing else.</li><li>Elections HQ is listed in <b>assets/tools.json</b> (Planning) and the relay\'s <b>_internal/projects.json</b> in GitMISMO.github.io.</li></ul><p>The copy in Claude is a backup; work in the resources.mismo.org one.</p>'],
  ["How It\'s Connected","Meeting Trackers",'<p>Meeting Trackers is the source of truth for which groups are active and for attendance. Elections HQ holds a snapshot of every group, the meetings held each year, and each leader\'s attendance, shown on the Leadership Roster and beside each person serving now. A small script in Meeting Trackers can keep it current every day (not switched on yet).</p><p><b>Elected leaders go back to Meeting Trackers.</b> When you apply the results for a Business Domain or Area of Focus, the new Chair, Vice Chair or Co-Chairs are written into Meeting Trackers\' Workgroup Leadership, marked "Elections HQ". Care and Feeding Leads stay in Elections HQ. Anything that couldn\'t be sent waits and can be sent again from the results panel. Whoever applies results needs Meeting Trackers access too.</p><p>Voting in Area of Focus and Domain elections is one vote per member company that took part that year.</p>'],
  ["How It\'s Connected","The public forms",'<p>Three pages on resources.mismo.org, in the website\'s look (the Home page hero; no menu, search or log in until the new site launches, and the logo and footer links aren\'t linked):</p><ul><li><b>forms/elections/nominate/</b>: anyone can nominate. It reads the open seats from slates/nominate.json and opens and closes itself on the nomination dates.</li><li><b>forms/elections/confirm/</b>: the personal link each nominee gets to say yes or no.</li><li><b>forms/elections/ballot/</b>: the ballot, built from the confirmed nominees once you press Publish for that election.</li></ul><p>Each form posts to its Power Automate flow, which files the entry in elections-hq-data. Change the open and close dates in Dates and Forms; the form follows them.</p>'],
  ["How It\'s Connected","Power Automate flows",'<p>Two Power Automate flows, owned by your account, connect the forms and the Outbox to the records. Neither holds a GitHub key: GitHub\'s own workflows in elections-hq-data do the saving.</p><ul><li><b>Elections Forms</b>: the nomination, confirmation and ballot pages post to it. It hands each entry to GitHub, and the <b>Election form entries</b> workflow files it: nominations in <b>nomsubs</b>, nominee answers in <b>responses</b>, ballots in <b>votes</b>. A ballot is never changed; your decisions sit beside it in voteflags.</li><li><b>Elections Send Email</b>: the <b>Elections Outbox</b> workflow runs whenever the Outbox changes and every 10 minutes on weekdays. It sends what you pressed Send on, and on its date (weekdays 9 to 5 Eastern) anything set to Send Automatically, through this flow, then records each one in <b>outsent</b>. Posts to MISMO Connect and emails to MBA Legal go from your mailbox; everything else from the elections mailbox. Files attached to a message (like the certification count) go with it. Nothing is sent twice, and a draft is never sent.</li></ul><p>Each flow\'s address is pasted once on <b>Public Forms</b>, under Flow Addresses. The forms\' address is published for the forms; the send address stays private.</p>'],
  ["How It\'s Connected","Email addresses",'<ul><li><b>elections@mismo.org</b> is what people see. The mailbox is <b>elections@mba.org</b> (mismo.org is an alias); IT makes elections@mismo.org its primary address so replies come back to it.</li><li><b>Posts to MISMO Connect come from you</b> (jcritchley@mba.org). Higher Logic only accepts an emailed post from a community member, and you\'re a member of every Area of Focus and Task Force. To post as someone else, change it in Outbox, Addresses.</li><li><b>MISMO Connect addresses</b> (MISMO-&hellip;@ConnectedCommunity.org) come from Higher Logic\'s admin Discussions list and are set on the Structure page.</li><li><b>Facilitators</b> are first initial and last name @mismo.org.</li><li><b>MBA Legal</b>, who certifies the results, and the emails to them come from you.</li></ul>'],
  ["Automation","The Outbox",'<p>Elections HQ drafts every email on schedule: the call for nominations, the facilitator briefs, the nominee confirmation, the gaps notice, the last call, ballots, reminders, the one-company notice, the heads-up and the request to certify for MBA Legal, and the results.</p><p>Each kind of message is set to <b>I\'ll Send It</b> (it waits in Ready for You until you press <b>Send</b>, twice to be sure), <b>Send Automatically</b> (it goes on its date, weekdays 9 to 5 Eastern) or <b>Don\'t Draft</b>. Everything starts as I\'ll Send It. <b>Send All Due</b> sends every draft dated today or earlier, also after a second press. Drag a message back to Ready for You, or press <b>Hold for Me</b>, to stop it before it goes. Each message shows who it\'s from, who it goes to and exactly what they\'ll see, in MISMO\'s branded email look. Press <b>Draft Now</b> to read a message before its date.</p>'],
  ["Automation","Nominee confirmations",'<p>When a nomination is accepted, the nominee gets an email with a personal link to say yes or no. Their answer is logged and the nominee moves to On the Ballot, or to Not Going Ahead, with nothing for you to do. Open a nominee and press <b>Nominee\'s Confirmation</b> to see what they see.</p>'],
  ["Nominations","How a nomination comes in",'<ol><li>Someone fills in the public nomination form.</li><li>It lands in From the Form on Nominations, flagged if it looks like spam or is already there.</li><li>Drag it to To Confirm (or press Accept). The nominee is emailed to confirm.</li><li>When they say yes, it moves to On the Ballot.</li></ol><p>Nominees must work for a MISMO member company (Bylaws, Article IV).</p>'],
  ["Voting","One company, one vote",'<p>When a company sends more than one ballot for the same group, those ballots are held. The one-company email goes to them; when they answer, press <b>Count This One</b> on the ballot that stands. For the Governance Committee, if both the MVR and the MVA vote, the Alternate\'s ballot is dismissed.</p><p>Ballots emailed to elections@mismo.org go in with <b>+ Ballot Sent by Email</b> on Ballots and Results.</p>'],
  ["Results","Certifying the results with MBA Legal",'<p>Every year the Governance Committee results go to MBA Legal, as a third party, to confirm the election was fair.</p><ol><li>When the Call for Vote goes out, a <b>Heads-Up to MBA Legal</b> is drafted with the dates.</li><li>On the audit date, the <b>Request to Certify</b> is drafted from the count: the process with its dates, the ballots received, any company that voted twice and which ballot counted, any tie and how it was settled, and every seat\'s elected and not elected nominees. The ballot breakdown and the count are attached.</li><li>Press <b>Certification</b> on the results to see it, draft it again after settling ballots, and record when it comes back.</li></ol><p>Who certifies (Michael Briggs is leaving) is set in Outbox, Addresses; leave it blank until it\'s decided, and the drafts wait in Needs Attention. These come from your address.</p>'],
  ["Results","Final results and the roster",'<ol><li>Settle every ballot on hold.</li><li>For the Governance Committee, send the Request to Certify and record it when it\'s back.</li><li>Press <b>Mark Results Final</b>. The elected and thank-you emails are drafted.</li><li>Press <b>Apply to the Roster</b>. New leaders are added, outgoing leaders move to Former, everyone new appears on Onboarding, Domain Chairs appear on the Council of Chairs, and the new leaders are written into Meeting Trackers.</li></ol>'],
  ["Board","How the Board slate works",'<p>Board members aren\'t voted on by members. The Nominating Committee recommends the slate and MBA\'s President and CEO elects the Board. The Board page keeps the slate: who\'s leaving, who\'s joining, extensions, committee roles (including the Prioritization Committee) and officers. The names go to MBA at least 30 days before year end (by December 1); Elections HQ flags it if that date is later.</p>']
].concat(Object.keys(BYLAWS).map(k=>["The Bylaws", BYLAWS[k].t, '<ul>'+BYLAWS[k].pts.map(p=>'<li>'+esc(p)+'</li>').join("")+'</ul><p class="note">'+esc(BYLAWS[k].cite)+'. Bylaws of the Mortgage Industry Standards Maintenance Organization, Inc., as amended January 20, 2022. A plain-words summary; the Bylaws themselves govern.</p>']));
function renderHelp(){
  const el=$("#page-help"); const cur=SUB.help||0;
  const groups=[...new Set(HELP.map(h=>h[0]))];
  el.innerHTML=phead("Help","Help and How-To","How to run each election in Elections HQ, step by step.","")+
    '<div class="helpwrap"><nav class="helpnav">'+groups.map(g=>'<div class="hg">'+esc(g)+'</div>'+HELP.map((h,i)=>h[0]===g?'<button type="button" data-h="'+i+'"'+(i===cur?' aria-current="true"':'')+'>'+esc(h[1].replace(/^./,c=>c.toUpperCase()))+'</button>':'').join("")).join("")+'</nav>'+
    '<div class="helpbody"><div class="card"><div class="cb"><div class="eyebrow">'+esc(HELP[cur][0])+'</div><h2>'+esc(HELP[cur][1].replace(/^./,c=>c.toUpperCase()))+'</h2>'+HELP[cur][2]+'</div></div></div></div>';
  $$("[data-h]",el).forEach(b=>b.onclick=()=>{ SUB.help=+b.dataset.h; renderHelp(); });
}

/* ================= rail (Marketing HQ's, with this tool's search) ================= */
(function(){
  const KEY='hq.rail.off';
  function set(off, remember){
    document.body.classList.toggle('railmini', !!off);
    const h=document.getElementById('rail-hide');
    if(h){ h.setAttribute('aria-expanded', off?'false':'true'); h.setAttribute('aria-label', off?'Open the menu':'Narrow the menu'); h.title = (off?'Open the menu':'Narrow the menu')+' (backslash)'; }
    if(off) close();
    if(remember!==false){ try{ localStorage.setItem(KEY, off?'1':'0'); }catch(e){} }
    setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 230);
  }
  function toggle(){ set(!document.body.classList.contains('railmini')); }
  function start(){
    let off=null;
    try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==='1'); }catch(e){}
    if(off===null) off = window.matchMedia('(max-width:900px)').matches;
    set(off, false);
    const h=document.getElementById('rail-hide'); if(h) h.addEventListener('click',toggle);
    const sc=document.getElementById('rail-scrim'); if(sc) sc.addEventListener('click',()=>set(true));
    const qb=document.getElementById('rail-qb');
    if(qb) qb.addEventListener('click',()=>{ set(false); setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q) q.focus(); },230); });
    document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
      b.addEventListener('click',()=>{ show(b.dataset.hq); if(window.matchMedia('(max-width:900px)').matches) set(true); });
    });
    wireFind();
  }
  document.addEventListener('keydown',e=>{
    const t=e.target; const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
    if(e.key==='Escape' && PANE && !typing){ closePane(); return; }
    if(e.key==='\\' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); set(false); setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q){ q.focus(); q.select(); } }, 230); }
  });
  const HITS=()=>document.getElementById('rail-hits');
  let picked=-1, rows=[];
  function nm(x){ return String(x||'').replace(/\s+/g,' ').trim().toLowerCase(); }
  function gather(q){
    const t=nm(q); if(t.length<2) return [];
    const out=[];
    const score=n=>{ n=nm(n); return n===t?3:n.indexOf(t)===0?2:n.indexOf(t)>=0?1:0; };
    const push=(group,name,where,go_,hay)=>{ if(out.length<60) out.push({group,name,where,go:go_,s:Math.max(score(name), hay&&nm(hay).indexOf(t)>=0?1:0)}); };
    try{ vals("nominations").forEach(n=>{ const hay=[fullName(n),n.company,n.email].join(" "); if(nm(hay).indexOf(t)<0) return; const c=S.cycles[n.cycle]; const s=S.seats[n.seat]; push("Nominees", fullName(n)||n.company||"", (c?c.year+" "+TYPES[c.type].short:"")+(s?" · "+seatLabel(s):""), ()=>{ if(c&&c.type==="board"){ CY=+c.year; SUB.board="prospects"; go("board"); openProspect(n.id,c); } else openNomination(n.id); }, hay); }); }catch(e){}
    try{ vals("leaders").forEach(l=>{ const hay=[l.name,l.company,l.group,l.position].join(" "); if(nm(hay).indexOf(t)<0) return; push(l.status==="former"?"Former Leaders":"Leaders", l.name, [l.position,l.group].filter(Boolean).join(" · "), ()=>{ if(l.gtype==="board") openBoardMember(l.id); else openLeader(l.id); }, hay); }); }catch(e){}
    try{ vals("groups").forEach(g=>{ if(nm(g.name).indexOf(t)<0) return; push("Groups", g.name, GTYPE[g.type]||"", ()=>{ SUB.roster=g.type; go("roster"); }, g.name); }); }catch(e){}
    try{ vals("slate").forEach(x=>{ const hay=[x.person,x.company,x.detail].join(" "); if(nm(hay).indexOf(t)<0) return; push("Board Slate", (SLATE_KIND[x.kind]||"")+": "+(x.person||""), x.company||"", ()=>{ SUB.board="slate"; go("board"); openSlate(x.id,S.cycles[x.cycle]); }, hay); }); }catch(e){}
    try{ vals("tasks").forEach(x=>{ if(nm(x.title).indexOf(t)<0) return; const c=S.cycles[x.cycle]; push("Tasks", x.title, (c?c.year+" "+TYPES[c.type].short:"")+(x.due?" · "+fS(x.due):""), ()=>openTask(x.id), x.title); }); }catch(e){}
    try{ HELP.forEach((h,i)=>{ const hay=h[1]+" "+h[2].replace(/<[^>]+>/g," "); if(nm(hay).indexOf(t)<0) return; push("Help", h[1], h[0], ()=>{ SUB.help=i; go("help"); }, hay); }); }catch(e){}
    const best={}; out.forEach(h=>{ best[h.group]=Math.max(best[h.group]||0,h.s); });
    out.sort((a,b)=>(best[b.group]-best[a.group])||(b.s-a.s)||String(a.name).localeCompare(String(b.name)));
    return out;
  }
  function draw(list){
    const box=HITS(); if(!box) return; box.textContent=''; rows=[]; picked=-1;
    if(!list.length){ const n=document.createElement('div'); n.className='rh-none'; n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return; }
    let g=null;
    list.slice(0,24).forEach(h=>{
      if(h.group!==g){ g=h.group; const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh';
      const n=document.createElement('b'); n.textContent=h.name; b.appendChild(n);
      if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); }); rows.push(b); box.appendChild(b);
    });
    box.hidden=false;
  }
  function close(){ const b=HITS(); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on', i===picked)); if(rows[picked]) try{ rows[picked].scrollIntoView({block:'nearest'}); }catch(e){} }
  function wireFind(){
    const q=document.getElementById('rail-q'), x=document.getElementById('rail-qx'); if(!q) return;
    let tmr=null;
    const run=()=>{ const v=q.value; if(x) x.hidden=!v; if(nm(v).length<2){ close(); return; } draw(gather(v)); };
    q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); });
    q.addEventListener('focus',()=>{ if(nm(q.value).length>=2) run(); });
    q.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ close(); q.blur(); return; }
      if(!rows.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); }
      else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); }
    });
    if(x) x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
    document.addEventListener('click',e=>{ if(!e.target.closest('.railfind')) close(); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();

/* ================= theme toggle (shared key) ================= */
(function theme(){
  var btn = document.getElementById("theme-btn"); if(!btn) return;
  function cur(){ var t = document.documentElement.getAttribute("data-theme"); if(t) return t; return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  function paint(){ const dark = cur() === "dark"; const lab = document.getElementById("theme-lab"); if(lab) lab.textContent = dark ? "Light Mode" : "Dark Mode"; btn.title = "Switch to " + (dark ? "light" : "dark") + " mode"; }
  btn.addEventListener("click", function(){ document.documentElement.setAttribute("data-theme", cur() === "dark" ? "light" : "dark"); paint(); try{ localStorage.setItem("mismo.portal.theme", cur()); }catch(e){} window.dispatchEvent(new Event("resize")); });
  try{ var saved = localStorage.getItem("mismo.portal.theme"); if(saved) document.documentElement.setAttribute("data-theme", saved); }catch(e){}
  paint();
})();
