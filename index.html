<!doctype html>
<!--
  Elections HQ, resources.mismo.org/elections-hq/
  BEFORE UPLOADING A NEW COPY OF THIS FILE: download the current index.html from GitHub first
  and make your changes to that copy. Uploading an older copy silently undoes everything that
  changed since.
  Built the same way as Marketing HQ, Member 360 and Summit HQ: the shared resources.mismo.org
  sign-in (/assets/session.js) and the one door to the save relay (project key "elections-hq", data
  in the PRIVATE repository GitMISMO/elections-hq-data). No GitHub token or other secret ever goes
  in this file, and no records either: they all arrive from elections-hq-data after sign-in.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elections HQ</title>
<!-- Hide the app until someone is signed in. If this file is replaced by an upload, carry this block across. -->
<style>html.hq-out body > *:not(#hq-gate):not(.rs-scrim){visibility:hidden}</style>
<script>(function(){
  var out = true;
  try {
    var s = JSON.parse(localStorage.getItem('resources:session') || 'null');
    out = !(s && s.token && s.expiresAt && Date.parse(s.expiresAt) > Date.now());
  } catch (e) { out = true; }
  document.documentElement.classList.add(out ? 'hq-out' : 'hq-in');
})();</script>
<script src="/assets/session.js"></script>
<script>(function(){
  function sync(){
    var rs = window.ResourcesSession, inn = !!(rs && rs.current());
    document.documentElement.classList.toggle('hq-out', !inn);
    document.documentElement.classList.toggle('hq-in', inn);
  }
  if (window.ResourcesSession) { window.ResourcesSession.onChange(sync); sync(); }
  else { document.addEventListener('DOMContentLoaded', function(){
    if (window.ResourcesSession) { window.ResourcesSession.onChange(sync); sync(); }
    else document.documentElement.classList.remove('hq-out');   // module missing: do not lock the page
  }); }
})();</script>
<script>
/* ============================================================================
   ELECTIONS HQ ON resources.mismo.org - the one door to MISMO's save relay
   ----------------------------------------------------------------------------
   Built the same way as Marketing HQ's, Member 360's and Summit HQ's doors.
   Elections HQ was built inside Claude, where it reached its records through
   window.claude.use('db'). This gives the page that same door, backed by the save
   relay instead, so none of the pages change.

   Where the data lives: the PRIVATE repository GitMISMO/elections-hq-data, reached
   only through the relay under the project key "elections-hq". This PUBLIC page
   holds no records at all: cycles, seats, nominations, ballots, the roster and the
   voter lists all arrive after sign-in.

   Two collections are written by the public forms' Power Automate flows, never by
   this page: nomsubs (form nominations) and votes (ballots). Staff decisions sit
   beside them in nomreviews and voteflags, so a ballot is never edited.

   What the public ballot shows (confirmed nominees' names, companies, titles and
   statements) is published into THIS public repository, slates/, through the second
   relay project "elections-hq-public", so the forms can read it without signing in.

   How documents are filed (the relay has no "list a folder" route): one file per
   collection, shaped {docs:{"<collection>/<id>": {...}}}.

   Switched on from the start: PREVIEW is false, and the records were copied from the
   Claude version into elections-hq-data on Oct 29, 2026. Until the save relay's GitHub key
   includes elections-hq-data and elections-hq, the page says so in plain words instead of
   opening. Nothing else needs changing here to turn it on.

   Saving: every save sends the version (sha) it last read. If someone else saved
   in between, the relay answers 409; the change is re-applied on top of theirs and
   sent again. Other people's changes are re-read every minute while the page is open.

   Sign-in is the shared resources.mismo.org sign-in (/assets/session.js). Who may
   open it, and who may save, is set per person in People & Access.
   ========================================================================== */
(function () {
  'use strict';
  if (window.__hqRelay) return;

  var RELAY_URL = 'https://rgvdi67cg27o5kcmiytcqbqnrm0hmztx.lambda-url.us-east-1.on.aws';
  var PROJECT = 'elections-hq', TOOL = 'Elections HQ';
  var PREVIEW = false;          /* see the header: false once Elections HQ is switched on */
  var POLL_MS = 60000, IDLE_POLL_MS = 180000, IDLE_AFTER = 10 * 60000, COOL_POLL_MS = 1800000;
  /* collections whose documents each get a file of their own (the big synced ones) */
  var OWN = [];
  function hot(name) { return name !== 'own-index'; }
  var FLUSH_MS = 350, RETRY_MS = 8000;
  var MAX_FILE = 940000;        /* the relay takes at most 1,000,000 bytes a save */

  /* ---------- browser storage: every tool shares this web address ----------
     This page's own keys (the remembered menu width and the like) are filed under
     tools:elections-hq: so they cannot collide with another tool's. The sign-in and the
     MISMO theme are shared on purpose and are left alone. */
  (function () {
    var P = 'tools:elections-hq:';
    var shared = function (k) { k = String(k); return k.indexOf('tools:') === 0 || k.indexOf('resources:') === 0 || k === 'mismo.portal.theme'; };
    try {
      var S = Storage.prototype, g = S.getItem, s = S.setItem, r = S.removeItem;
      S.getItem = function (k) { return g.call(this, shared(k) ? k : P + k); };
      S.setItem = function (k, v) { return s.call(this, shared(k) ? k : P + k, v); };
      S.removeItem = function (k) { return r.call(this, shared(k) ? k : P + k); };
    } catch (e) {}
  })();

  function RS() { return window.ResourcesSession || null; }
  function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function safe(s) { return String(s).toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/-{3,}/g, '--').replace(/^-+|-+$/g, '') || 'x'; }
  function err(code, message, status) { var e = new Error(message || code); e.code = code; e.status = status || 0; return e; }
  function now() { return Date.now(); }

  /* ---------- where a document is filed ---------- */
  function place(path) {
    var seg = String(path).split('/');
    if (seg.length !== 2) throw err('invalid_argument', 'Not a document path: ' + path);
    if (OWN.indexOf(seg[0]) >= 0) return { file: safe(seg[0] + '-' + seg[1]).slice(0, 40), own: true, coll: seg[0], id: seg[1] };
    return { file: safe(seg[0]).slice(0, 40), coll: seg[0], id: seg[1] };
  }
  function parentOf(path) { var s = String(path).split('/'); return s.slice(0, -1).join('/'); }
  function idOf(path) { var s = String(path).split('/'); return s[s.length - 1]; }

  /* ---------- talking to the relay ---------- */
  var status = { offline: false, lastError: '' };
  function net(method, name, body) {
    var rs = RS(), tok = rs && rs.token();
    if (!tok) return Promise.reject(err('SIGNED_OUT', 'Not signed in', 401));
    var headers = { 'Authorization': 'Bearer ' + tok };
    if (body) headers['Content-Type'] = 'application/json';
    return fetch(RELAY_URL + '/' + PROJECT + '/data/' + encodeURIComponent(name), {
      method: method, cache: 'no-store', headers: headers, body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      status.offline = false;
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (r.ok) return b;
        var e = err((b && b.error) || ('HTTP_' + r.status), b && b.message, r.status);
        e.gh = (b && typeof b.status === 'number') ? b.status : 0;   /* what GitHub itself answered */
        if (r.status === 401 && rs) { needSignIn(); }
        throw e;
      });
    }, function () { status.offline = true; throw err('OFFLINE', 'Could not reach the relay', 0); });
  }

  /* ---------- files ---------- */
  var F = {};
  function file(name, own) {
    if (!F[name]) F[name] = { name: name, own: !!own, server: null, sha: null, loaded: false, loading: null,
      loadedAt: 0, pending: [], timer: null, flushing: false, view: null, waitingSignIn: false };
    return F[name];
  }
  function normalise(f, c) {
    c = c && typeof c === 'object' ? c : {};
    if (f.own) return { doc: c.doc === undefined ? null : c.doc };
    return { docs: c.docs && typeof c.docs === 'object' ? c.docs : {} };
  }
  function load(f) {
    if (f.loading) return f.loading;
    f.loading = net('GET', f.name).then(function (b) {
      return { content: normalise(f, b && b.data), sha: (b && b.sha) || null };
    }, function (e) {
      /* the relay answers a missing file with {data:null}; a 404 means something else is
         wrong (most often UNKNOWN_PROJECT) and must not be mistaken for an empty file */
      if (e && e.status === 404 && (e.code === 'NOT_FOUND' || e.code === 'HTTP_404')) return { content: normalise(f, null), sha: null };
      throw e;
    }).then(function (got) {
      var before = f.loaded ? JSON.stringify(f.server) : null;
      f.server = got.content; f.sha = got.sha; f.loaded = true; f.loadedAt = now(); f.view = null;
      f.loading = null;
      if (before !== JSON.stringify(f.server)) notify(f, false);
      return f;
    }, function (e) { f.loading = null; throw e; });
    return f.loading;
  }
  function ensure(f) { return f.loaded ? Promise.resolve(f) : load(f); }

  function applyOps(f, content, ops) {
    ops.forEach(function (op) {
      if (f.own) {
        if (op.kind === 'set') content.doc = clone(op.data);
        else if (op.kind === 'update') content.doc = Object.assign({}, content.doc || {}, clone(op.data));
        else if (op.kind === 'delete') content.doc = null;
        return;
      }
      if (op.kind === 'set') content.docs[op.path] = clone(op.data);
      else if (op.kind === 'update') content.docs[op.path] = Object.assign({}, content.docs[op.path] || {}, clone(op.data));
      else if (op.kind === 'delete') delete content.docs[op.path];
    });
    return content;
  }
  function viewOf(f) {
    if (!f.loaded) return null;
    if (!f.view) f.view = applyOps(f, clone(f.server), f.pending);
    return f.view;
  }
  function docIn(f, path) {
    var v = viewOf(f); if (!v) return undefined;
    var d = f.own ? v.doc : v.docs[path];
    return d === undefined ? null : d;
  }

  /* ---------- saving ---------- */
  function queue(path, kind, data) {
    if (PREVIEW) {
      if (now() - previewWarned > 4000) { previewWarned = now(); toast('This is the preview of Elections HQ on resources.mismo.org \u2014 nothing here is saved. Keep using the Claude version until it\u2019s switched on.', 'bad'); }
      return Promise.reject(err('invalid_argument', 'Preview: not saved'));
    }
    var p = place(path), f = file(p.file, p.own);
    return new Promise(function (res, rej) {
      var go = function () {
        if (kind === 'update' && f.loaded && docIn(f, path) === null) { rej(err('not-found', 'No document to update: ' + path)); return; }
        f.pending.push({ kind: kind, path: path, data: data, res: res, rej: rej }); f.view = null;
        if (p.own) register(path, kind !== 'delete');
        notify(f, true);
        schedule(f, FLUSH_MS);
      };
      if (kind === 'update' && !f.loaded) ensure(f).then(go, function (e) { rej(e); });
      else { if (!f.loaded) ensure(f).catch(function () {}); go(); }
    });
  }
  var previewWarned = 0;
  /* files that hold one document each are listed in own-index, so a collection can be read back */
  function register(path, present) {
    var r = file('own-index');
    var known = r.loaded ? !!(viewOf(r).docs[path]) : null;
    if (known === present) return;
    r.pending.push({ kind: present ? 'set' : 'delete', path: path, data: present ? { file: place(path).file } : null,
      res: function () {}, rej: function () {} });
    r.view = null;
    if (!r.loaded) ensure(r).catch(function () {}); else notify(r, true);
    schedule(r, FLUSH_MS);
  }
  function schedule(f, ms) {
    if (f.timer) return;
    f.timer = setTimeout(function () { f.timer = null; flush(f); }, ms);
  }
  /* GitHub makes one commit to a branch at a time, so every save goes out after the
     one before it has finished, never side by side. */
  var putChain = Promise.resolve();
  function put(name, body) {
    var go = function () { return net('PUT', name, body); };
    var p = putChain.then(go, go);
    putChain = p.then(function () {}, function () {});
    return p;
  }
  function flush(f) {
    if (f.flushing || !f.pending.length) return;
    if (!(RS() && RS().token())) { f.waitingSignIn = true; needSignIn(); return; }
    f.flushing = true;
    var batch = f.pending.slice(), tries = 0;
    var attempt = function () {
      return ensure(f).then(function () {
        var next = applyOps(f, clone(f.server), batch);
        /* the relay saves files pretty-printed and can only read back a file under 1 MB, so the pretty size is what counts */
        if (JSON.stringify(next, null, 2).length > MAX_FILE) throw err('TOO_BIG', 'This part of Elections HQ has grown too big to save in one piece.');
        return put(f.name, { content: next, sha: f.sha }).then(function (b) {
          f.server = next; f.sha = (b && b.sha) || f.sha; f.loadedAt = now();
          f.pending = f.pending.filter(function (op) { return batch.indexOf(op) < 0; }); f.view = null;
          batch.forEach(function (op) { op.res(); });
          notify(f, false);
          saved();
        });
      }).catch(function (e) {
        if (e && e.status === 409 && tries < 8) {
          tries++;
          f.loaded = false;
          return new Promise(function (r) { setTimeout(r, 300 * tries + Math.random() * 500); })
            .then(function () { return load(f); }).then(attempt);
        }
        throw e;
      });
    };
    attempt().catch(function (e) {
      /* a 502 from the relay with TOKEN or GITHUB is a setup problem, not a blip: say so at
         once rather than retrying quietly forever */
      var transient = e && (e.code === 'OFFLINE' || e.status === 401 || e.code === 'SIGNED_OUT' ||
        (e.status >= 500 && e.code !== 'TOKEN' && e.code !== 'GITHUB' && e.code !== 'REJECTED') ||
        (e.code === 'GITHUB' && (e.gh >= 500 || !e.gh && /timed? ?out|ETIMEDOUT|ECONNRESET|fetch failed/i.test(e.message || ''))));
      if (transient) {
        /* nothing is lost: the change stays queued and goes out once the relay is back */
        if (e.status === 401 || e.code === 'SIGNED_OUT') f.waitingSignIn = true;
        else setTimeout(function () { schedule(f, 0); }, RETRY_MS);
        problem(e);
        return;
      }
      f.pending = f.pending.filter(function (op) { return batch.indexOf(op) < 0; }); f.view = null;
      batch.forEach(function (op) { op.rej(e); });
      notify(f, false);
      problem(e, true);
    }).then(function () {
      f.flushing = false;
      if (f.pending.length && !f.waitingSignIn) schedule(f, FLUSH_MS);
    });
  }
  function anyPending() { return Object.keys(F).some(function (k) { return F[k].pending.length; }); }
  window.addEventListener('beforeunload', function (e) {
    if (anyPending()) { e.preventDefault(); e.returnValue = 'Elections HQ is still saving.'; return e.returnValue; }
  });

  /* ---------- snapshots and listeners ---------- */
  function docSnap(path, data, pending) {
    var exists = data !== null && data !== undefined;
    return { id: idOf(path), exists: exists, ref: { id: idOf(path), path: path },
      data: function () { return exists ? clone(data) : undefined; },
      metadata: { hasPendingWrites: !!pending, fromCache: false } };
  }
  var docL = [], collL = [];
  function docValue(path) {
    var p = place(path);
    return docIn(file(p.file, p.own), path);
  }
  function isOwn(coll) { return OWN.indexOf(coll) >= 0; }
  function ownPaths(coll) {
    var r = viewOf(file('own-index')); if (!r) return [];
    return Object.keys(r.docs).filter(function (p) { return parentOf(p) === coll; });
  }
  function collDocs(coll) {
    var out = {};
    if (isOwn(coll)) {
      ownPaths(coll).forEach(function (p) { var f = F[place(p).file]; if (f && f.loaded) { var d = docIn(f, p); if (d !== null) out[p] = d; } });
      return out;
    }
    var v = viewOf(file(place(coll + '/x').file));
    if (v) Object.keys(v.docs).forEach(function (p) { if (parentOf(p) === coll) out[p] = v.docs[p]; });
    return out;
  }
  /* the files a collection's listeners depend on */
  function filesOfColl(coll) {
    if (!isOwn(coll)) return [place(coll + '/x').file];
    return ['own-index'].concat(ownPaths(coll).map(function (p) { return place(p).file; }));
  }
  function loadColl(coll) {
    if (!isOwn(coll)) return ensure(file(place(coll + '/x').file));
    return ensure(file('own-index')).then(function () {
      return Promise.all(ownPaths(coll).map(function (p) { return ensure(file(place(p).file, true)); }));
    });
  }
  function collSnap(coll, changes, pending) {
    var docs = collDocs(coll), list = Object.keys(docs).map(function (p) { return docSnap(p, docs[p], pending); });
    return { docs: list, size: list.length, empty: !list.length,
      forEach: function (fn) { list.forEach(fn); },
      docChanges: function () { return changes || list.map(function (d) { return { type: 'added', doc: d }; }); },
      metadata: { hasPendingWrites: !!pending, fromCache: false } };
  }
  function notify(f, pending) {
    if (f.name === 'own-index') collL.forEach(function (l) {   /* a new own document: load it */
      if (isOwn(l.coll)) ownPaths(l.coll).forEach(function (p) { var of = file(place(p).file, true); if (!of.loaded && !of.loading) ensure(of).catch(function () {}); });
    });
    docL.forEach(function (l) {
      if (place(l.path).file !== f.name || !f.loaded) return;
      var d = docValue(l.path), sig = JSON.stringify(d);
      if (l.primed && sig === l.sig) return;
      l.primed = true; l.sig = sig;
      try { l.cb(docSnap(l.path, d, pending)); } catch (e) { console.error(e); }
    });
    collL.forEach(function (l) {
      var files = filesOfColl(l.coll);
      if (files.indexOf(f.name) < 0) return;
      if (!files.every(function (n) { return file(n).loaded; })) return;
      var docs = collDocs(l.coll), changes = [], seen = {};
      Object.keys(docs).forEach(function (p) {
        var sig = JSON.stringify(docs[p]); seen[p] = 1;
        if (!(p in l.last)) changes.push({ type: 'added', doc: docSnap(p, docs[p], pending) });
        else if (l.last[p] !== sig) changes.push({ type: 'modified', doc: docSnap(p, docs[p], pending) });
        l.last[p] = sig;
      });
      Object.keys(l.last).forEach(function (p) {
        if (!seen[p]) { changes.push({ type: 'removed', doc: docSnap(p, null, pending) }); delete l.last[p]; }
      });
      if (l.primed && !changes.length) return;
      l.primed = true;
      try { l.cb(collSnap(l.coll, changes, pending)); } catch (e) { console.error(e); }
    });
  }

  /* ---------- the store, in the shape the tabs already use ---------- */
  function docRef(path) {
    var p = place(path);
    var need = function () { return ensure(file(p.file, p.own)); };
    return {
      id: p.id, path: path,
      get: function () { return need().then(function () { return docSnap(path, docValue(path), false); }); },
      set: function (data) { return queue(path, 'set', data); },
      update: function (patch) { return queue(path, 'update', patch); },
      delete: function () { return queue(path, 'delete', null); },
      onSnapshot: function (cb, errCb) {
        var l = { path: path, cb: cb, primed: false, sig: null }; docL.push(l);
        need().then(function () {
          if (l.primed) return;
          var d = docValue(path);
          l.primed = true; l.sig = JSON.stringify(d);
          cb(docSnap(path, d, false));
        }).catch(function (e) { if (errCb) errCb(e); });
        return function () { var i = docL.indexOf(l); if (i >= 0) docL.splice(i, 1); };
      }
    };
  }
  function collRef(coll, max) {
    var ref = {
      id: coll, path: coll,
      doc: function (id) { return docRef(coll + '/' + (id || (now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      add: function (data) {
        var id = now().toString(36) + Math.random().toString(36).slice(2, 8);
        return queue(coll + '/' + id, 'set', data).then(function () { return { id: id, path: coll + '/' + id }; });
      },
      limit: function (n) { return collRef(coll, n); },
      where: function () { return ref; }, orderBy: function () { return ref; },
      get: function () {
        return loadColl(coll).then(function () {
          var s = collSnap(coll, null, false);
          if (max && s.docs.length > max) { s.docs = s.docs.slice(0, max); s.size = s.docs.length; }
          return s;
        });
      },
      onSnapshot: function (cb, errCb) {
        var l = { coll: coll, cb: cb, primed: false, last: {} }; collL.push(l);
        loadColl(coll).then(function () {
          if (l.primed) return;
          var docs = collDocs(coll); Object.keys(docs).forEach(function (p) { l.last[p] = JSON.stringify(docs[p]); });
          l.primed = true; cb(collSnap(coll, null, false));
        }).catch(function (e) { if (errCb) errCb(e); });
        return function () { var i = collL.indexOf(l); if (i >= 0) collL.splice(i, 1); };
      }
    };
    return ref;
  }
  function hasListener(f) {
    return docL.some(function (l) { return place(l.path).file === f.name; }) ||
      collL.some(function (l) { return filesOfColl(l.coll).indexOf(f.name) >= 0; });
  }
  var DB = { doc: docRef, collection: function (c) { return collRef(c); } };

  /* ---------- keeping up with everyone else ---------- */
  var lastActive = now();
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, function () { lastActive = now(); }, { capture: true, passive: true });
  });
  function poll(force) {
    if (!ready || !(RS() && RS().token())) return;
    if (PREVIEW && !force) return;          /* nothing changes in the preview copy */
    if (!force && document.visibilityState === 'hidden') return;
    var idle = now() - lastActive > IDLE_AFTER;
    Object.keys(F).forEach(function (k) {
      var f = F[k];
      if (!f.loaded || f.flushing || f.pending.length || f.loading || !hasListener(f)) return;
      var gap = hot(k) ? (idle ? IDLE_POLL_MS : POLL_MS) : COOL_POLL_MS;
      if (!force && now() - (f.polledAt || f.loadedAt) < gap) return;
      f.polledAt = now();
      load(f).catch(function () {});
    });
  }
  setInterval(function () { poll(false); }, 5000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') poll(true); });

  /* ---------- who is signed in ----------
     The page stamps each change with the id it is given and shows the name that id
     resolves to. Here the id carries both, "Name <email>", so every person's name
     shows on the history, not only the viewer's own. */
  function me() { var s = RS() && RS().current(); return { name: (s && s.name) || '', email: (s && s.email) || '' }; }
  function myId() { var m = me(); return m.email ? (m.name ? m.name + ' <' + m.email + '>' : m.email) : ''; }
  var NAMES = {};                /* Claude account ids already in the data -> names (from names.json) */
  function nameOf(id) { id = String(id || ''); var i = id.indexOf(' <'); return i > 0 ? id.slice(0, i) : (NAMES[id] || (id === 'claude' ? 'Claude' : '')); }
  var USER = {
    id: function () { return Promise.resolve(myId()); },
    profiles: function (ids) { var o = {}; (ids || []).forEach(function (id) { o[id] = { name: nameOf(id) }; }); return Promise.resolve(o); },
    can: function () { var rs = RS(); return Promise.resolve(!PREVIEW && !!(rs && rs.canEdit && rs.canEdit(PROJECT))); },
    me: function () { return Promise.resolve(me()); },
    profile: function () { return Promise.resolve(me()); }
  };

  /* ---------- files handed to the person ---------- */
  var DOWNLOADS = {
    save: function (o) {

.railhits{margin-top:7px;background:var(--surface);border:1px solid var(--border-strong,#adc4d6);border-radius:6px;box-shadow:0 10px 26px rgba(6,32,47,.3);overflow:hidden auto;max-height:min(52vh,420px)}
.railhits .rh-g{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);background:var(--sunk);padding:4px 10px;border-bottom:1px solid var(--line);position:sticky;top:0}
.railhits .rh{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 10px;color:var(--ink);font-family:var(--ui);cursor:pointer}
.railhits .rh:last-child{border-bottom:0}
.railhits .rh:hover,.railhits .rh.on{background:var(--accent-soft)}
.railhits .rh b{display:block;font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.railhits .rh i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:var(--ink-3);margin-top:1px;overflow-wrap:anywhere}
.railhits .rh-none{padding:10px;font-size:12px;color:var(--ink-3)}
.hq nav{display:flex;flex-direction:column;gap:1px;padding:8px 8px 4px;flex:0 0 auto}
.hq nav a.navlink{text-decoration:none;box-sizing:border-box}
.hq nav a.navlink .ext{margin-left:auto;font-style:normal;font-size:12px;opacity:.6}
.hq nav button,.hq nav a.navlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.hq nav a.navlink svg,.hq nav button svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.hq nav a.navlink:hover,.hq nav button:hover{color:#fff;background:rgba(255,255,255,.09)}
.hq nav button[aria-current]{color:#fff;font-weight:600;background:var(--navy-mid,#14486e);box-shadow:inset 3px 0 0 var(--sky)}
.hq nav button[aria-current] svg{opacity:1;stroke:var(--sky)}
.hq nav button:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.hq nav .nbadge{margin-left:auto;font-size:10.5px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.12);color:#fff}
.hq nav .nbadge.hot{background:#c25a4f}
.hq nav .navsep{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.42);padding:10px 10px 4px}
body.railmini .hq nav .navsep{display:none}
.hq .mast-right{margin-top:auto;display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:8px 8px 10px;border-top:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.railnote{font-size:10.5px;color:rgba(255,255,255,.6);padding:4px 10px 6px;line-height:1.35}
.railnote b{color:#fff;font-weight:600;display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.railnote .ok{color:#7fd8b4}.railnote .no{color:#f3a59b}
.theme-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.theme-btn .ti{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.theme-btn .ti-sun{display:none}
:root[data-theme="dark"] .theme-btn .ti-moon{display:none}
:root[data-theme="dark"] .theme-btn .ti-sun{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-btn .ti-moon{display:none}:root:not([data-theme="light"]) .theme-btn .ti-sun{display:block}}
.theme-btn:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.09)}
.theme-btn:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.hq .mast-right #theme-btn{margin-top:5px;padding-top:11px;border-top:1px solid rgba(80,164,219,.18);border-radius:0 0 6px 6px}
.railscrim{position:fixed;inset:0;z-index:94;background:rgba(6,32,47,.42);border:0;padding:0;display:none}
@media(max-width:900px){
  body:not(.railmini){padding-left:var(--rail-mini)}
  body:not(.railmini) .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
  body:not(.railmini) .hq.rail{box-shadow:4px 0 26px rgba(6,32,47,.4)}
  body:not(.railmini) .railscrim{display:block}
}

/* ===== page ===== */
main{padding-block:22px 60px;padding-left:max(22px, env(safe-area-inset-left,0px));padding-right:max(22px, env(safe-area-inset-right,0px));min-width:0}
main select{max-width:260px}
@media(max-width:600px){main{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}}
.page[hidden]{display:none}
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.phead .eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.phead h1{font-size:27px;font-weight:700;line-height:1.15;color:var(--ink)}
.phead .sub{color:var(--ink-2);font-size:13.5px;margin-top:3px}
.phead .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.flabel{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
select,input[type=text],input[type=number],input[type=url],input[type=search].plain,textarea{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:5px;padding:7px 10px;color:var(--ink);font-size:13.5px;min-width:0;width:100%}
textarea{min-height:84px;resize:vertical;line-height:1.5}
select:focus,input:focus,textarea:focus{outline:2px solid var(--sky);outline-offset:0}

/* buttons: shaped like the theme toggle — small rounded rectangle, thin border */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:max-content;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-mid)}
:root[data-theme="dark"] .btn.pri{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* the navy band with figure boxes */
.band{background:var(--band);color:var(--band-ink);border-radius:8px;padding:16px 18px 18px;margin-bottom:22px;border:1px solid var(--band-line)}
.band .today{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--sky)}
.band .say{font-size:16.5px;font-weight:600;line-height:1.45;margin:6px 0 14px}
.band .say em{font-style:normal;color:var(--sky)}
em,i,cite,dfn,var,address{font-style:normal}  /* no italics anywhere */
/* Branding */
.brorders{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.brorders .lnk{font-size:13.5px}
.brbar{height:5px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:8px;overflow:hidden}
.brbar i{display:block;height:100%;background:var(--sky);border-radius:3px}
.brkinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:6px 22px;padding:14px 16px}
.brk{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;align-items:center;gap:10px;border:1px solid transparent;background:none;color:inherit;font:inherit;text-align:left;padding:7px 8px;border-radius:6px;cursor:pointer}
.brk:hover{background:var(--surface-3)}
.brk.on{border-color:var(--sky);background:var(--accent-soft)}
.brk-n{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk-bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.brk-bar i{display:block;height:100%;background:var(--good);border-radius:3px}
.brk-c{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
/* Image Library */
.im-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.im-filters select,.im-filters input[type=search]{height:34px;font-size:13px;min-width:0;width:auto}
.im-filters input[type=search]{width:min(220px,100%)}
.im-arch{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.imgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:16px}
.imcard{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;min-width:0;transition:border-color .15s,box-shadow .15s,transform .15s}
.imcard:hover,.imcard:focus-visible{border-color:var(--sky);box-shadow:0 8px 22px -14px rgba(7,29,46,.55);transform:translateY(-1px);outline:none}
.imcard.arch{opacity:.6}
.imcard{position:relative}
.imsel{position:absolute;top:8px;left:8px;z-index:2;background:var(--surface);border:1px solid var(--border);border-radius:5px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.imsel input{width:16px;height:16px;margin:0;accent-color:var(--navy,#0d314c);cursor:pointer}
.imnote{display:block;font:600 11px/1.3 Arial,Helvetica,sans-serif;color:#9a5b00;background:#fff4e0;border:1px dashed #e0a440;padding:6px 8px;margin:-10px 0 14px}
.imthumb{aspect-ratio:16/10;background:repeating-conic-gradient(var(--rule) 0 25%,transparent 0 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.imthumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.imload{font-size:12px;color:var(--ink-3)}
.imbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.imbody>b{font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.immeta{display:flex;gap:5px;flex-wrap:wrap}
.imsub{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.imact{display:flex;gap:6px;margin-top:2px}
.impv{background:repeating-conic-gradient(var(--rule) 0 25%,transparent 0 50%) 0 0/16px 16px;border:1px solid var(--border);border-radius:8px;display:flex;justify-content:center;max-height:340px;overflow:hidden}
.impv img{max-width:100%;max-height:340px;object-fit:contain;display:block}
.imstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:10px;width:100%}
.impick{aspect-ratio:1;border:1px solid var(--border);border-radius:6px;padding:0;background:var(--surface-2,#f4f7fa);overflow:hidden;cursor:pointer}
.impick:hover,.impick:focus-visible{border-color:var(--sky);outline:2px solid var(--sky);outline-offset:1px}
.impick img{width:100%;height:100%;object-fit:cover;display:block}
body.im-drop #page-images .card{outline:3px dashed var(--sky);outline-offset:4px}
body.im-drop #page-images::before{content:"Drop to add to the Image Library";display:block;text-align:center;font-weight:600;color:var(--sky);margin-bottom:10px}
.band .say .hot{color:#f3a59b}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--band-tile);border:1px solid var(--band-line);border-radius:6px;padding:12px 14px;min-width:0;text-align:left;color:inherit;font:inherit;cursor:default}
button.tile{cursor:pointer}
button.tile:hover{background:rgba(255,255,255,.12)}
.tile .v{font-size:27px;font-weight:700;line-height:1.1}
.tile .v.hot{color:#f3a59b}
.tile .v.sky{color:var(--sky)}
.tile .k{font-size:12.5px;font-weight:600;color:var(--sky);margin-top:5px}
.tile .s{font-size:11.5px;color:rgba(255,255,255,.62);margin-top:1px}

/* cards & sections */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;min-width:0}
.card+.card{margin-top:22px}
.card>.ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.card>.ch h2{font-size:15.5px;font-weight:700}
.card>.ch .cnt{font-size:11.5px;font-weight:700;color:var(--ink-3);background:var(--surface-3);border-radius:4px;padding:2px 7px}
.card>.ch .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card>.cb{padding:14px 16px}
.card>.cb.flush{padding:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
.note{color:var(--ink-3);font-size:12.5px}
.foot{color:var(--ink-3);font-size:11.5px;margin-top:26px;line-height:1.5}
.empty{padding:22px 16px;color:var(--ink-2);font-size:13.5px}
.empty b{color:var(--ink)}

/* sub-tab buttons (Summit HQ: The Plan / Planning Meeting / All Tasks) */
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.subtabs button{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.subtabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .subtabs button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .subtabs button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}}
.subtabs .n{font-size:11px;font-weight:700;color:var(--bad)}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--accent-soft)}
table.t td.n,table.t th.n{text-align:right}
table.t td .t2{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
table.t tr.past td{color:var(--ink-3)}
table.t tr.slot td{color:var(--ink-3);font-style:normal}

/* chips: rectangles with slightly rounded corners, never pills */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;border-radius:4px;padding:2px 7px;white-space:nowrap;border:1px solid transparent;line-height:1.4}
.chip.wait{background:var(--surface-3);color:var(--ink-2)}
.chip.in{background:var(--accent-soft);color:var(--navy-mid);border-color:var(--border)}
.chip.review{background:var(--warn-soft);color:var(--warn)}
.chip.changes{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.ch{background:transparent;border-color:var(--border-strong);color:var(--ink-2)}
:root[data-theme="dark"] .chip.in{color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.in{color:var(--sky)}}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.k-matters{--k:var(--c1)} .k-micdup{--k:var(--c2)} .k-linkedin{--k:var(--c3)} .k-youtube{--k:var(--c5)} .k-mailchimp{--k:var(--c4)} .k-summit{--k:var(--c6)} .k-orders{--k:var(--warn)} .k-news{--k:var(--ink-3)} .k-setup{--k:var(--navy-mid)} .k-community{--k:#8a6bd1} .k-other{--k:var(--ink-3)}
.dot{background:var(--k,var(--ink-3))}
.ticks{display:inline-flex;gap:3px;align-items:center}
.tk{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:700;border:1px solid var(--border-strong);color:var(--ink-3)}
.tk.on{background:var(--good);border-color:var(--good);color:#fff}
.tk.due{border-color:var(--bad);color:var(--bad)}

/* calendar */
.calnav{display:flex;align-items:center;gap:8px}
.calnav .m{font-weight:700;font-size:15px;min-width:140px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.55fr));border-top:1px solid var(--rule)}
.cal .dh{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3);padding:7px 8px;background:var(--surface-2);border-bottom:1px solid var(--border);text-align:center}
.cal .d{min-height:104px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:5px 5px 7px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d:nth-child(7n){border-right:0}
.cal .d.out{background:var(--surface-2)}
.cal .d.out .num{color:var(--ink-3);opacity:.6}
.cal .d.today{background:var(--accent-soft)}
.cal .d.today .num{background:var(--navy);color:#fff;border-radius:4px;padding:0 5px}
.cal .d.we{background:var(--surface-2)}
.cal .num{font-size:11.5px;font-weight:700;color:var(--ink-2);align-self:flex-start}
.ev{display:flex;align-items:center;gap:5px;font-size:11px;line-height:1.25;border:1px solid var(--border);border-left:3px solid var(--k,var(--ink-3));background:var(--surface);border-radius:4px;padding:3px 5px;cursor:pointer;text-align:left;width:100%;min-width:0;color:var(--ink)}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev:hover{background:var(--accent-soft)}
.ev.done span{text-decoration:line-through;color:var(--ink-3)}
.ev.big{font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:10px 16px;border-top:1px solid var(--rule)}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media(max-width:760px){.cal{grid-template-columns:repeat(7,minmax(0,1fr))}.cal .d{min-height:70px}.ev span{display:none}.ev{padding:3px;justify-content:center;width:auto}}

/* agenda list */
.agenda{display:flex;flex-direction:column}
.agday{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--rule)}
.agday:last-child{border-bottom:0}
.agday .dl{font-size:12px;font-weight:700;color:var(--ink-2)}
.agday .dl small{display:block;font-weight:500;color:var(--ink-3)}
.agday.today .dl{color:var(--navy-mid)}
.agitems{display:flex;flex-direction:column;gap:5px;min-width:0}
.agi{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;background:none;border:0;padding:2px 0;text-align:left;color:var(--ink);min-width:0}
.agi:hover .tt{text-decoration:underline}
.agi .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.agi .who{color:var(--ink-3);font-size:11.5px;margin-left:auto;white-space:nowrap}

/* checklists */
.checks{display:flex;flex-direction:column}
.chk{display:flex;align-items:flex-start;gap:10px;padding:9px 16px;border-bottom:1px solid var(--rule)}
.chk:last-child{border-bottom:0}
.chk input{width:16px;height:16px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--good)}
.chk .ct{flex:1;min-width:0}
.chk .ct b{font-weight:600;display:block}
.chk .ct small{color:var(--ink-3);font-size:12px;display:block}
.chk.done .ct b{text-decoration:line-through;color:var(--ink-3)}
.chk .meta{font-size:11.5px;color:var(--ink-3);white-space:nowrap;text-align:right}
.chk .meta.late{color:var(--bad);font-weight:700}
.chk button.lnk{background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left;font:inherit}
.chk button.lnk:hover b{text-decoration:underline}

/* milestones */

.taskrow .tw2{font-size:12.5px;color:var(--ink-2)}
.taskrow.dragging{opacity:.35}
.taskrow.over{box-shadow:inset 0 3px 0 var(--sky)}
.phaseh{padding:9px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.tpl{border:1px solid var(--border);border-radius:8px;background:var(--surface);margin-bottom:14px}
.tpl .th{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tpl .th b{font-size:14px}
.tpl .th .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tpl .tb{padding:14px 16px}
.tpl .subj{font-weight:700;margin-bottom:8px;font-size:13.5px}
.tpl pre{white-space:pre-wrap;font:inherit;font-size:13px;line-height:1.55;margin:0;color:var(--ink)}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pick select{width:auto;max-width:100%}
.onb{display:flex;gap:4px;flex-wrap:wrap}
.onb .tk{width:auto;padding:0 6px;height:20px;font-size:10.5px;cursor:pointer;background:transparent}
.onb .tk.on{background:var(--good);border-color:var(--good);color:#fff}
.kvwide{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 22px;padding:14px 16px}
.kvwide div small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.kvwide div b{font-size:14px}
.inbox-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px 16px;border-bottom:1px solid var(--rule);align-items:start}
.inbox-item:last-child{border-bottom:0}
.inbox-item .who b{font-size:14px}
.inbox-item .who small{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.inbox-item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.elcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:22px}
.elcard{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:14px 16px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.elcard:hover{border-color:var(--border-strong);background:var(--accent-soft)}
.elcard .et{display:flex;gap:8px;align-items:center;justify-content:space-between}
.elcard .et b{font-size:15px}
.elcard .en{font-size:12.5px;color:var(--ink-2)}
.elcard .enx{font-size:13px}
.elcard .enx b{color:var(--ink)}
.stg{display:flex;gap:3px}
.stg i{flex:1;height:5px;border-radius:2px;background:var(--surface-3)}
.stg i.on{background:var(--c1)}
.stg i.now{background:var(--sky)}
/* the forms, in the website look the certification forms use */
.ef{max-width:none;color:var(--ink)}
.ef .ef-hero{background:#071d2e;color:#fff;border-radius:8px;padding:22px 24px;margin-bottom:18px}
.ef .ef-hero small{display:block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#74bfeb}
.ef .ef-hero h2{font-size:24px;margin:4px 0 6px;color:#fff}
.ef .ef-hero p{margin:0;color:#a9d8f3;font-size:14px}
.ef fieldset{border:1px solid var(--border);border-radius:8px;padding:14px 16px 16px;margin:0 0 14px;background:var(--surface)}
.ef legend{font-weight:700;font-size:14px;padding:0 6px}
.ef .opts{display:flex;flex-direction:column;gap:8px}
.ef .opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--surface)}
.ef .opt:hover{border-color:var(--border-strong)}
.ef .opt input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--navy-mid);flex:0 0 auto}
.ef .opt b{display:block;font-size:13.5px}
.ef .opt small{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.ef .opt.on{border-color:var(--navy-mid);background:var(--accent-soft)}
.ef .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.ef .err{color:var(--bad);font-size:13px;margin-top:10px}
.ef .done{padding:26px 22px;border:1px solid var(--good);background:var(--good-soft);border-radius:8px;color:var(--ink)}
.ef .done b{font-size:16px;display:block;margin-bottom:4px}
.ef .closed{padding:22px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
.ef .seatq{padding:12px 0;border-top:1px solid var(--rule)}
.ef .seatq:first-of-type{border-top:0;padding-top:0}
.ef .seatq h4{margin:0 0 8px;font-size:14px}
.ef .seatq h4 small{font-weight:500;color:var(--ink-3);margin-left:6px}
.ef .ack{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.ef .ack input{margin:2px 0 0;width:16px;height:16px;flex:0 0 auto}
@media (max-width:700px){.taskrow{grid-template-columns:20px 20px minmax(0,1fr);}.taskrow .td,.taskrow .tw2{grid-column:3}.trow{grid-template-columns:minmax(0,1fr) 54px}.trow .bar{grid-column:1/-1;grid-row:2}.mixrow{grid-template-columns:minmax(0,1fr) 70px}.mixrow .cells{grid-column:1/-1}}

.efn{color:var(--ink-3);font-weight:400;font-size:12.5px}

/* ===== Elections HQ: the visual layer (boards, maps and cards instead of long lists) ===== */
.band.tight{padding:14px 16px}
.band.tight .today{margin-bottom:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.toolbar .sp{flex:1}
.fbtn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;min-width:max-content;display:inline-flex;gap:7px;align-items:center}
.fbtn:hover{border-color:var(--navy-mid)}
.fbtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .fbtn[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fbtn[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}}
.fbtn .n{font-size:11px;font-weight:700;opacity:.75}
.fbtn i{width:10px;height:10px;border-radius:2px;display:inline-block}
.findbox{position:relative;min-width:220px}
.findbox input{padding-left:30px!important}
.findbox svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
/* state colors, one set for every map */
:root{--st-gap:var(--bad);--st-gap-bg:var(--bad-soft);--st-conf:var(--warn);--st-conf-bg:var(--warn-soft);--st-ok:var(--good);--st-ok-bg:var(--good-soft);--st-con:var(--c1);--st-con-bg:var(--accent-soft);--st-wait:var(--ink-3);--st-wait-bg:var(--surface-3)}
.sw-gap{background:var(--st-gap)}.sw-conf{background:var(--st-conf)}.sw-ok{background:var(--st-ok)}.sw-con{background:var(--st-con)}.sw-wait{background:var(--st-wait)}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.legend2 span{display:inline-flex;gap:6px;align-items:center}
.legend2 i{width:11px;height:11px;border-radius:2px;display:inline-block}
/* election season timeline */
.season{padding:14px 16px 16px}
.sz-axis{position:relative;height:20px;margin-left:170px;border-bottom:1px solid var(--rule)}
.sz-axis span{position:absolute;top:0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-3);transform:translateX(2px);white-space:nowrap}
.sz-row{display:grid;grid-template-columns:170px minmax(0,1fr);align-items:center;min-height:44px;border-bottom:1px solid var(--rule)}
.sz-row:last-child{border-bottom:0}
.sz-name{font-weight:700;font-size:13px;padding-right:10px;cursor:pointer;background:none;border:0;text-align:left;color:var(--ink);font-family:inherit}
.sz-name small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3)}
.sz-track{position:relative;height:44px}
.sz-bar{position:absolute;top:14px;height:16px;border-radius:3px;opacity:.9}
.sz-bar.nom{background:var(--c1)}.sz-bar.vote{background:var(--c3)}.sz-bar.after{background:var(--c4)}.sz-bar.slate{background:var(--c5)}
.sz-pin{position:absolute;top:11px;width:3px;height:22px;background:var(--ink);border-radius:1px;cursor:pointer}
.sz-pin:hover::after,.sz-pin:focus::after{content:attr(data-tip);position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:11.5px;padding:4px 8px;border-radius:4px;white-space:nowrap;z-index:5}
.sz-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:3;pointer-events:none}
.sz-today b{position:absolute;top:-18px;left:4px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--bad);white-space:nowrap}
.sz-body{position:relative}
.sz-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--rule)}
/* card grids */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cgrid.wide{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.gcard{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:12px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:9px;min-width:0}
.gcard:hover{border-color:var(--navy-mid);box-shadow:0 2px 10px rgba(13,49,76,.08)}
.gcard .gh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gcard .gh b{font-size:14px;line-height:1.3}
.gcard .gh small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:2px}
.gcard .gf{font-size:12px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.pos5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.pcell{border-radius:4px;padding:6px 4px 5px;text-align:center;border:1px solid transparent;min-width:0}
.pcell b{display:block;font-size:10.5px;letter-spacing:.05em}
.pcell span{display:block;font-size:15px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.pcell.gap{background:var(--st-gap-bg);color:var(--st-gap);border-color:color-mix(in srgb,var(--st-gap) 35%,transparent)}
.pcell.conf{background:var(--st-conf-bg);color:var(--st-conf);border-color:color-mix(in srgb,var(--st-conf) 35%,transparent)}
.pcell.ok{background:var(--st-ok-bg);color:var(--st-ok);border-color:color-mix(in srgb,var(--st-ok) 35%,transparent)}
.pcell.con{background:var(--st-con-bg);color:var(--st-con);border-color:color-mix(in srgb,var(--st-con) 35%,transparent)}
.pcell.wait{background:var(--st-wait-bg);color:var(--ink-3)}
/* matrix */
.matrix{width:100%;border-collapse:separate;border-spacing:4px;font-size:12.5px}
.matrix th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700;text-align:center;padding:4px}
.matrix th:first-child{text-align:left}
.matrix td.mn{font-weight:600;white-space:nowrap;padding-right:10px;cursor:pointer}
.matrix td.mc{border-radius:4px;padding:6px 8px;cursor:pointer;min-width:120px;font-size:12px;line-height:1.3}
.matrix td.mc small{display:block;opacity:.8;font-size:11px}
.matrix td.mc.gap{background:var(--st-gap-bg);color:var(--st-gap)}
.matrix td.mc.conf{background:var(--st-conf-bg);color:var(--st-conf)}
.matrix td.mc.ok{background:var(--st-ok-bg);color:var(--st-ok)}
.matrix td.mc.con{background:var(--st-con-bg);color:var(--st-con)}
.matrix td.mc.wait{background:var(--st-wait-bg);color:var(--ink-3)}
.matrix td.mc:hover,.matrix td.mn:hover{outline:2px solid var(--navy-mid)}
/* seat slots (Governance, Council) */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1.5px dashed var(--border-strong);border-radius:6px;padding:10px;min-height:64px;font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;justify-content:center}
.slot.f{border-style:solid;border-color:var(--st-ok);background:var(--st-ok-bg);color:var(--ink)}
.slot.r{border-color:var(--st-conf);background:var(--st-conf-bg);color:var(--ink)}
.slot b{font-size:13px}
.slot small{display:block;color:var(--ink-2);font-size:11.5px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(220px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:4px}
.kcol{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 290px)}
.kcol.over{border-color:var(--sky);box-shadow:inset 0 0 0 2px var(--sky)}
.kcol .kh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px}
.kcol .kh i{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.kcol .kh .n{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:700}
.kcol .kb{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:60px}
.kcol .kmore{font-size:12px;color:var(--ink-3);padding:4px 4px 8px;text-align:center}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 10px;cursor:pointer;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.kcard[draggable="true"]{cursor:grab}
.kcard:hover{border-color:var(--navy-mid)}
.kcard.dragging{opacity:.35}
.kcard b{font-size:13px;line-height:1.3}
.kcard small{color:var(--ink-2);font-size:11.5px;line-height:1.35}
.kcard .kt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.kcard .kt .late{color:var(--bad);font-weight:700}
.kcard .kacts{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.kcard.flag{border-left:3px solid var(--warn)}
.kcard.spam{border-left:3px solid var(--bad)}
.kcard.done b{text-decoration:line-through;color:var(--ink-3)}
/* people tiles */
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ptile{border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:9px 10px;cursor:pointer;display:flex;gap:9px;align-items:center;text-align:left;font:inherit;color:inherit;min-width:0}
.ptile:hover{border-color:var(--navy-mid)}
.ptile .av{width:32px;height:32px;border-radius:5px;background:var(--accent-soft);color:var(--navy-mid);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
.ptile.leave{border-color:var(--warn);background:var(--warn-soft)}
.ptile.leave .av{background:var(--warn);color:#fff}
.ptile.join{border-color:var(--good);background:var(--good-soft)}
.ptile.join .av{background:var(--good);color:#fff}
.ptile.ext .av{background:var(--c1);color:#fff}
.ptile .pt{min-width:0}
.ptile .pt b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptile .pt small{display:block;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catblock{padding:12px 16px;border-bottom:1px solid var(--rule)}
.catblock:last-child{border-bottom:0}
.catblock h3{font-size:13px;margin:0 0 9px;display:flex;gap:10px;align-items:center}
.catblock h3 .mv{margin-left:auto;font-size:12px;color:var(--ink-2)}
.meter{height:8px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:flex;flex:0 0 160px}
.meter i{display:block;height:100%}
/* two-pane reader (Communications) */
.reader{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:16px;align-items:start}
.rlist{border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden;max-height:calc(100vh - 230px);overflow-y:auto}
.rlist button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 12px;cursor:pointer;font:inherit;color:inherit;align-items:flex-start}
.rlist button:last-child{border-bottom:0}
.rlist button:hover{background:var(--accent-soft)}
.rlist button[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--navy-mid)}
.rlist .rd{flex:0 0 46px;text-align:center;border:1px solid var(--border);border-radius:5px;padding:3px 0;font-size:10.5px;font-weight:700;color:var(--ink-2);line-height:1.2;background:var(--surface)}
.rlist .rd b{display:block;font-size:15px;color:var(--ink)}
.rlist .rt b{display:block;font-size:13px}
.rlist .rt small{display:block;font-size:11.5px;color:var(--ink-3)}
.rview .tpl{margin:0}
/* results */
.rcard{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rcard h3{font-size:14px;margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rline{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:8px;font-size:12.5px;align-items:center}
.rline .rp{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.rline .rw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rline .rw.none{color:var(--ink-3)}
.rline .rv{font-variant-numeric:tabular-nums;color:var(--ink-2)}
/* pager */
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-2)}
/* onboarding cards */
.obcard .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.obcard .steps button{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);border-radius:4px;font:inherit;font-size:11px;font-weight:600;padding:5px 4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obcard .steps button.on{background:var(--good);border-color:var(--good);color:#fff}
.prog{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good)}
/* roster cards */
.rlead{display:grid;grid-template-columns:62px minmax(0,1fr);gap:2px 8px;font-size:12.5px;align-items:baseline}
.rlead .rp{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;color:var(--ink-3);white-space:nowrap}
.rlead .rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlead .rn small{color:var(--ink-3)}
.split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.split2,.reader{grid-template-columns:minmax(0,1fr)}.kanban{grid-template-columns:repeat(var(--cols,4),minmax(240px,1fr))}}
@media (max-width:700px){.sz-row{grid-template-columns:110px minmax(0,1fr)}.sz-axis{margin-left:110px}.matrix td.mc{min-width:90px}}
/* the dated steps as one compact line */
.miles{display:flex;overflow-x:auto;gap:0}
.mile{flex:1 0 100px;padding:8px 10px 7px}
.mile .ml{font-size:9.5px;letter-spacing:.05em;line-height:1.3;min-height:25px}
.mile .md{font-size:14px;margin-top:1px}
.mile .mw{font-size:11px}
.sz-today b{left:auto;right:5px}
/* the structure chart */
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.stdom{border:1px solid var(--border);border-left:4px solid var(--c1);border-radius:8px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.stdom.cross{border-left-color:var(--c2)}
.stdom .sdh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stdom .sdn{background:none;border:0;padding:0;font:inherit;font-weight:700;font-size:14.5px;color:var(--ink);cursor:pointer;text-align:left}
.stdom .sdl{font-size:12px;color:var(--ink-2)}
.stdom .sdsub{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-top:4px}
.stchips{display:flex;flex-direction:column;gap:5px}
.stchip{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--border);border-radius:4px;padding:6px 9px;background:var(--accent-soft);font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;text-align:left}
.stdom.cross .stchip.aof{background:color-mix(in srgb,var(--c2) 12%,var(--surface))}
.stchip.tf{background:var(--surface);border-style:dashed;border-color:var(--border-strong)}
.stchip:hover{border-color:var(--navy-mid)}
.stchip i{font-style:normal;font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px;white-space:nowrap}
.stchip.st-live i{background:var(--good-soft);color:var(--good)}
.stchip.st-quiet i,.stchip.st-hold i{background:var(--warn-soft);color:var(--warn)}
.stchip.st-arch i,.stchip.st-none i{background:var(--bad-soft);color:var(--bad)}
.stchip.st-new i{background:var(--accent-soft);color:var(--navy-mid)}
.stchip .nw{font-size:10px;color:var(--c2);font-weight:700;margin-left:4px}
.card .stchips{flex-direction:row;flex-wrap:wrap}
.card .stchips .stchip{flex:0 1 260px}
/* two Co-Chair slots on a card */
.slots.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.slot.mini{min-height:46px;padding:7px 8px}
.slot.mini b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* attendance on the roster */
.rlead.att{grid-template-columns:44px minmax(0,1fr) 78px}
.rlead .ra{display:flex;align-items:center;gap:5px;justify-content:flex-end}
.rlead .ra i{display:inline-block;width:34px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--good) var(--p),var(--surface-3) var(--p))}
.rlead .ra i.mid{background:linear-gradient(90deg,var(--warn) var(--p),var(--surface-3) var(--p))}
.rlead .ra i.lo{background:linear-gradient(90deg,var(--bad) var(--p),var(--surface-3) var(--p))}
.rlead .ra i.none{background:var(--surface-3)}
.rlead .ra b{font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:34px;text-align:right}
/* what's happening */
.feed{display:flex;flex-direction:column}
.feed .fe{display:grid;grid-template-columns:90px 190px minmax(0,1fr);gap:10px;padding:8px 16px;border:0;border-bottom:1px solid var(--rule);background:none;font:inherit;font-size:12.5px;color:var(--ink);text-align:left;cursor:pointer;align-items:baseline}
.feed .fe:last-child{border-bottom:0}
.feed .fe:hover{background:var(--accent-soft)}
.feed .fw{color:var(--ink-3);font-size:11.5px}
.feed .fd{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){.feed .fe{grid-template-columns:70px minmax(0,1fr)}.feed .fd{grid-column:2}}
.mailprev{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#f1f6fa;color:#0d314c}
.mailprev a{pointer-events:none}
/* changing dates: live checks and what a change affects */
.dt-ok{font-size:13px;color:var(--good,#0f7b5c);background:var(--good-soft,#e3f3ed);border-radius:6px;padding:8px 12px;margin-bottom:14px}
.dt-warn{font-size:13px;color:var(--ink);background:var(--warn-soft,#fdf3e1);border:1px solid var(--warn,#b26b00);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.dt-warn .dt-h{display:block;color:var(--warn,#b26b00);margin-bottom:4px}
.dt-warn ul,.imp{margin:4px 0 0;padding-left:18px}
.dt-warn li,.imp li{margin:3px 0;font-size:13px;line-height:1.45}
.dt-warn li.bad,.imp li.bad{color:var(--bad,#b3372c)}
.imp{margin-bottom:10px}
/* the Bylaws: (i) buttons beside page titles and in panels */
.bylaw-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.infob{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 10px 4px 7px;cursor:pointer;line-height:1.2}
.infob:hover{border-color:var(--sky,#74bfeb);color:var(--ink)}
.infob svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;flex:0 0 auto}
.bylaw-more{display:flex;flex-wrap:wrap;gap:6px}
#pane .bylaw-row{margin:0 0 14px}

</style>

<script>

/* ================= the public forms (shared by Elections HQ and the website copies) =================
   EF.nominate(el, {elections, submit, onDone})   elections: [{cycle, type, name, open, closes, groups:[{name, positions:[{seat, position}]}], seats:[{seat, position}], boardSeats}]
   EF.ballot(el, {slate, code, submit})            slate: what slateOf() returns
   submit(record) returns a promise; the record is what gets filed (nomsubs or votes). */
var EF = (function(){
  "use strict";
  function e(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function id(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function val(root,n){ var x=root.querySelector('[name="'+n+'"]'); if(!x) return ""; if(x.type==="checkbox") return x.checked; return String(x.value||"").trim(); }
  function radio(root,n){ var x=root.querySelector('[name="'+n+'"]:checked'); return x?x.value:""; }
  function fld(name,label,type,req,extra){ return '<div class="field"><label for="ef-'+name+'">'+e(label)+(req?'':' <span class="efn">(optional)</span>')+'</label><input id="ef-'+name+'" name="'+name+'" type="'+(type||"text")+'" autocomplete="'+(extra||"off")+'"'+(req?' required':'')+'></div>'; }
  var LONG={aof:"Area of Focus Co-Chairs", domain:"Business Domain Leadership", goc:"Governance Committee", board:"Board of Directors"};
  var WHAT={aof:"Two Co-Chairs for each Area of Focus", domain:"Chair, Vice Chair and Care and Feeding Lead for each Business Domain", goc:"The five members who confirm MISMO's process was followed", board:"Recommend someone for MISMO's Board of Directors"};
  function fmt(s){ var m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return ""; var d=new Date(+m[1],+m[2]-1,+m[3]); return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]+", "+["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()]+" "+d.getDate(); }

  function nominate(el, cfg){
    var open=(cfg.elections||[]).filter(function(x){ return x.open; });
    var started=Date.now();
    var hero='<div class="ef-hero"><small>MISMO Elections</small><h2>Nominate a Leader</h2><p>Nominate yourself or a colleague. Every nomination is reviewed by MISMO staff, and we confirm with each nominee before anything appears on a ballot.</p></div>';
    if(!open.length){ el.innerHTML='<div class="ef">'+hero+'<div class="closed"><b>Nominations are closed right now.</b><br>Questions? Write to elections@mismo.org.</div></div>'; return; }
    var pre=cfg.preset||open[0].cycle;
    el.innerHTML='<form class="ef" novalidate>'+hero+
      '<fieldset><legend>Which election?</legend><div class="opts">'+open.map(function(x){ return '<label class="opt'+(x.cycle===pre?" on":"")+'"><input type="radio" name="cycle" value="'+e(x.cycle)+'"'+(x.cycle===pre?" checked":"")+'><span><b>'+e(LONG[x.type]||x.name)+'</b><small>'+e(WHAT[x.type]||"")+(x.closes?' · nominations close '+e(fmt(x.closes)):'')+'</small></span></label>'; }).join("")+'</div></fieldset>'+
      '<fieldset id="ef-seatbox"><legend>Seat</legend><div class="fgrid" id="ef-seat"></div></fieldset>'+
      '<fieldset><legend>Are you nominating yourself?</legend><div class="opts"><label class="opt on"><input type="radio" name="self" value="yes" checked><span><b>Yes, I\'m nominating myself</b></span></label><label class="opt"><input type="radio" name="self" value="no"><span><b>No, I\'m nominating someone else</b></span></label></div></fieldset>'+
      '<fieldset><legend id="ef-nlg">Your details</legend><div class="fgrid">'+fld("first","First Name","text",true,"given-name")+fld("last","Last Name","text",true,"family-name")+fld("email","Work Email","email",true,"email")+fld("company","Company","text",true,"organization")+fld("title","Job Title","text",true,"organization-title")+'</div></fieldset>'+
      '<fieldset id="ef-by" hidden><legend>About you, the nominator</legend><div class="fgrid">'+fld("byFirst","Your First Name","text",true)+fld("byLast","Your Last Name","text",true)+fld("byEmail","Your Work Email","email",true)+fld("byCompany","Your Company","text",true)+'</div>'+
        '<div class="field" style="margin-top:12px"><label>Has the nominee agreed to be nominated?</label><div class="opts"><label class="opt"><input type="radio" name="aware" value="yes"><span><b>Yes</b></span></label><label class="opt"><input type="radio" name="aware" value="no"><span><b>Not yet</b><small>That\'s fine. MISMO will ask them.</small></span></label></div></div></fieldset>'+

  if((m=v.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/))){
    let y = m[3]? +m[3] : today().getFullYear(); if(y<100) y+=2000;
    const d=new Date(y,+m[1]-1,+m[2]); return isNaN(d)?null:iso(d);
  }
  if((m=v.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?$/))){
    const mi = MON.findIndex(x=>m[1].toLowerCase().startsWith(x.toLowerCase())); if(mi<0) return null;
    return iso(new Date(m[3]?+m[3]:today().getFullYear(), mi, +m[2]));
  }
  const d=new Date(v); return isNaN(d)?null:iso(d);
}

const S = {cycles:{}, seats:{}, nominations:{}, nomsubs:{}, nomreviews:{}, votes:{}, voteflags:{}, tasks:{}, leaders:{}, groups:{}, voters:{}, comms:{}, slate:{}, onboard:{}, settings:{}, mt:{}, outbox:{}, outsent:{}, responses:{}, mailin:{}, mtpush:{}};
let DB=null, DL=null, LIVE=false, LOADED=new Set(), CANWRITE=true;
function vals(c){ return Object.values(S[c]); }
async function getClaude(){
  for(let i=0;i<40 && !(window.claude && window.claude.use);i++) await new Promise(r=>setTimeout(r,100));
  return (window.claude && window.claude.use) ? window.claude : null;
}
async function connect(){
  const c = await getClaude();
  try{ DB = c ? await c.use("db") : null; }catch(e){ DB=null; }
  if(!DB){ $("#offline").hidden=false; saveNote(false); schedule(); return; }
  LIVE=true; saveNote(true);
  Object.keys(S).forEach(col=>{
    DB.collection(col).onSnapshot(snap=>{
      const o={}; snap.docs.forEach(d=>{ o[d.id]=Object.assign({id:d.id}, d.data()); });
      S[col]=o; LOADED.add(col); schedule();
    }, err=>{ saveNote(false, err && err.message); });
  });
  try{ DL = await c.use("downloads"); }catch(e){ DL=null; }
  try{ const u=await c.use("user"); if(u && u.can){ const can=await u.can("data.write"); if(can===false){ CANWRITE=false; const sb=$("#savebanner"); if(sb){ sb.innerHTML='<b>You have view-only access to Elections HQ.</b> You can look around; ask Jonna Critchley if you need to make changes.'; sb.hidden=false; } } } }catch(e){}
}
function saveNote(ok, why){

async function put(col,id,data){
  const clean = Object.assign({}, data); delete clean.id;
  clean.updatedAt = new Date().toISOString();
  S[col][id] = Object.assign({id}, clean); schedule();
  if(DB){ try{ await DB.collection(col).doc(id).set(clean); }catch(e){ toast("Couldn't save: "+(e.message||e.code||"try again"), 4000); throw e; } }
}
async function patch(col,id,part){ const cur=S[col][id]||{}; return put(col,id,Object.assign({},cur,part)); }
async function remove(col,id){

}

let CY = null;   /* the year terms begin, e.g. 2027 */
function years(){ const ys=new Set(vals("cycles").map(c=>+c.year).filter(Boolean)); if(!ys.size) ys.add(today().getFullYear()+1); return [...ys].sort((a,b)=>b-a); }
function curYear(){
  if(CY && years().includes(CY)) return CY;
  const open = vals("cycles").filter(c=>!c.closed).map(c=>+c.year).sort((a,b)=>a-b);
  CY = open[0] || years()[0];
  return CY;
}
function cyc(type, y){ return S.cycles[(y||curYear())+"-"+type] || null; }
function yearPick(id){ return '<label class="yearpick">Election Year <select id="'+id+'">'+years().map(y=>'<option value="'+y+'"'+(y===curYear()?" selected":"")+'>'+y+' Terms</option>').join("")+'</select></label>'; }
